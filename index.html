<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강호대전: 천하쟁패</title>
<style>
  :root { --bg:#14110f; --panel:#221c18; --line:#4a3a2c; --gold:#d9b46c; --text:#eadfce; --dim:#9a8b78; --red:#c0503c; --green:#6fae6a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  h1,h2,h3 { color:var(--gold); margin:0 0 10px; }
  #app { max-width:980px; margin:0 auto; padding:16px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .card { background:#2b231d; border:1px solid var(--line); border-radius:8px; padding:10px; cursor:pointer; }
  .card:hover { border-color:var(--gold); }
  .card.mine { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .card.taken { opacity:.55; cursor:not-allowed; }
  .card b { color:var(--gold); font-size:17px; }
  .dim { color:var(--dim); font-size:13px; }
  button { background:var(--gold); color:#2a1d0c; border:0; border-radius:6px; padding:8px 14px; font-weight:700; cursor:pointer; }
  button.sub { background:#3a2f26; color:var(--text); border:1px solid var(--line); }
  button.on { outline:2px solid var(--gold); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child,td:first-child { text-align:left; }
  .bar { height:10px; background:#3a2f26; border-radius:5px; overflow:hidden; }
  .bar > div { height:100%; background:var(--gold); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#3a2f26; margin-left:6px; }
  .tag.ai { color:var(--dim); } .tag.me { color:#2a1d0c; background:var(--gold); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
</style>
</head>
<body>
<div id="app"><div class="panel">접속 중... (처음 화면이 안 뜨면 새로고침)</div></div>

<script src="https://unpkg.com/playroomkit/multiplayer.umd.js"></script>
<script>
/* =========================================================
   강호대전: 천하쟁패  -  1단계 뼈대
   - 방 만들기/초대: Playroom Kit이 처리
   - 세계 계산: "방장" 브라우저가 담당 (방장이 나가면 자동으로 다른 사람이 이어받음)
   - 15분 = 1일
   ========================================================= */

const REALMS = ['삼류','이류','일류','절정','초절정','화경','현경','생사경','자연경'];
const DAY_SECONDS = 15 * 60;   // 실제 15분 = 게임 1일
const MAX_PLAYERS = 6;

// 구파일방 (9개). base = 경지별 시작 인원 [삼류 ~ 자연경]
const SECTS = {
  '소림파': { desc:'방어력, 외공, 대규모 병력', base:[900,300,90,20,4,1,0,0,0] },
  '무당파': { desc:'검술, 태극, 내공',          base:[400,200,90,30,6,2,0,0,0] },
  '화산파': { desc:'검술, 소수정예',            base:[200,120,70,30,8,2,0,0,0] },
  '종남파': { desc:'검법, 진법',                base:[350,180,80,25,5,1,0,0,0] },
  '아미파': { desc:'경공, 검술, 회복',          base:[350,180,80,25,5,1,0,0,0] },
  '개방':   { desc:'정보력, 인맥, 거대 조직',    base:[1200,250,60,12,3,1,0,0,0] },
  '곤륜파': { desc:'내공, 경공',                base:[300,160,80,28,6,1,0,0,0] },
  '공동파': { desc:'독특한 무공, 공격',          base:[300,170,85,30,6,1,0,0,0] },
  '점창파': { desc:'빠른 검술, 암습',            base:[250,140,70,28,7,1,0,0,0] },
};

// 하루에 한 경지 위로 올라갈 확률(비율). 초반은 빠르고 정점 이후로 갈수록 급격히 느려짐
const PROMOTE = [0.040, 0.030, 0.020, 0.008, 0.003, 0.001, 0.0003, 0.0001];

let players = [];          // 접속한 플레이어 목록
let started = false;

const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- 시작 ---------- */
async function boot() {
  try {
    await Playroom.insertCoin({
      maxPlayersPerRoom: MAX_PLAYERS,
      defaultPlayerStates: { sect: '' },
      // gameId: '여기에 Playroom 대시보드에서 받은 ID',  // 나중에 배포할 때 넣기
    });
  } catch (e) {
    $app.innerHTML = '<div class="panel">접속 실패: ' + esc(e.message || e) + '</div>';
    return;
  }

  Playroom.onPlayerJoin(player => {
    players.push(player);
    player.onQuit(() => { players = players.filter(p => p !== player); });
  });

  if (Playroom.isHost()) {
    if (!Playroom.getState('phase')) Playroom.setState('phase', 'select', true);
    if (!Playroom.getState('speed')) Playroom.setState('speed', 1, true);
    if (Playroom.getState('elapsed') == null) Playroom.setState('elapsed', 0, true);
  }

  setInterval(render, 500);        // 화면 갱신
  setInterval(hostTick, 1000);     // 시간 흐름 (방장만 실제로 계산)
  render();
}

/* ---------- 방장 전용: 시간 흐름 + 일일 처리 ---------- */
function hostTick() {
  if (!Playroom.isHost()) return;
  if (Playroom.getState('phase') !== 'play') return;

  const speed = Playroom.getState('speed') || 1;
  const elapsed = (Playroom.getState('elapsed') || 0) + speed;
  Playroom.setState('elapsed', elapsed, true);

  const day = Math.floor(elapsed / DAY_SECONDS) + 1;
  let done = Playroom.getState('processedDay') || 1;
  if (day > done) {
    let sects = JSON.parse(JSON.stringify(Playroom.getState('sects')));
    while (done < day) { dailyUpdate(sects); done++; }
    Playroom.setState('sects', sects, true);
    Playroom.setState('processedDay', done, true);
  }
}

// 하루가 지날 때마다 실행되는 성장 계산 (2단계에서 육성/경제로 확장할 자리)
function dailyUpdate(sects) {
  for (const name in sects) {
    const c = sects[name].counts;
    // 위에서부터 처리해야 같은 날 두 번 오르지 않음
    for (let i = REALMS.length - 2; i >= 0; i--) {
      const exact = c[i] * PROMOTE[i];
      let n = Math.floor(exact);
      if (Math.random() < exact - n) n++;
      n = Math.min(n, c[i]);
      c[i] -= n; c[i + 1] += n;
    }
    // 신규 입문자 (삼류)
    c[0] += Math.max(1, Math.round(SECTS[name].base[0] * 0.01));
  }
}

/* ---------- 행동(버튼) ---------- */
function pickSect(name) {
  const takenBy = players.find(p => p.getState('sect') === name);
  if (takenBy && takenBy.id !== Playroom.myPlayer().id) return;
  Playroom.myPlayer().setState('sect', name, true);
}

function startGame() {
  const sects = {};
  for (const name in SECTS) {
    const owner = players.find(p => p.getState('sect') === name);
    sects[name] = {
      owner: owner ? owner.id : 'AI',
      ownerName: owner ? owner.getProfile().name : 'AI',
      counts: SECTS[name].base.slice(),
    };
  }
  Playroom.setState('sects', sects, true);
  Playroom.setState('processedDay', 1, true);
  Playroom.setState('elapsed', 0, true);
  Playroom.setState('phase', 'play', true);
}

function setSpeed(v) { if (Playroom.isHost()) Playroom.setState('speed', v, true); }

$app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'pick') pickSect(el.dataset.name);
  if (a === 'start') startGame();
  if (a === 'speed') setSpeed(Number(el.dataset.v));
});

/* ---------- 화면 ---------- */
function render() {
  const phase = Playroom.getState('phase');
  $app.innerHTML = phase === 'play' ? renderPlay() : renderSelect();
}

function renderSelect() {
  const me = Playroom.myPlayer();
  const host = Playroom.isHost();
  const allPicked = players.length > 0 && players.every(p => p.getState('sect'));

  const cards = Object.keys(SECTS).map(name => {
    const owner = players.find(p => p.getState('sect') === name);
    const mine = owner && owner.id === me.id;
    const cls = 'card' + (mine ? ' mine' : '') + (owner && !mine ? ' taken' : '');
    return `<div class="${cls}" data-act="pick" data-name="${name}">
      <b>${name}</b>
      <div class="dim">${SECTS[name].desc}</div>
      <div style="margin-top:6px">${owner ? '선택: ' + esc(owner.getProfile().name) : '<span class="dim">비어 있음 (선택 안 되면 AI)</span>'}</div>
    </div>`;
  }).join('');

  const list = players.map(p =>
    `<div>${esc(p.getProfile().name)}${p.id === me.id ? '<span class="tag me">나</span>' : ''} — ${p.getState('sect') || '<span class="dim">아직 선택 안 함</span>'}</div>`
  ).join('');

  return `
    <div class="panel"><h1>⚔️ 강호대전: 천하쟁패</h1>
      <div class="dim">1단계 · 문파를 고르세요. 아무도 안 고른 문파는 AI가 운영합니다.</div></div>
    <div class="panel"><h3>구파일방</h3><div class="grid">${cards}</div></div>
    <div class="panel"><h3>접속자 (${players.length}/${MAX_PLAYERS})</h3>${list}
      <div style="margin-top:10px">
        ${host
          ? `<button data-act="start" ${allPicked ? '' : 'disabled'}>게임 시작</button> <span class="dim">${allPicked ? '' : '모든 접속자가 문파를 골라야 시작할 수 있어요'}</span>`
          : '<span class="dim">방장이 게임을 시작할 때까지 기다려 주세요</span>'}
      </div></div>`;
}

function fmtTime(elapsed) {
  const day = Math.floor(elapsed / DAY_SECONDS) + 1;
  const into = elapsed % DAY_SECONDS;
  const left = DAY_SECONDS - into;
  const mm = String(Math.floor(left / 60)).padStart(2, '0');
  const ss = String(Math.floor(left % 60)).padStart(2, '0');
  return { day, pct: (into / DAY_SECONDS) * 100, left: `${mm}:${ss}` };
}

function renderPlay() {
  const me = Playroom.myPlayer();
  const sects = Playroom.getState('sects');
  if (!sects) return '<div class="panel">세계를 불러오는 중...</div>';
  const t = fmtTime(Playroom.getState('elapsed') || 0);
  const speed = Playroom.getState('speed') || 1;
  const host = Playroom.isHost();

  const mySectName = Object.keys(sects).find(n => sects[n].owner === me.id);

  const speedBtns = host ? `<div class="row"><span class="dim">테스트 배속:</span>
    ${[1, 60, 900].map(v => `<button class="sub ${speed === v ? 'on' : ''}" data-act="speed" data-v="${v}">×${v}</button>`).join('')}
    <span class="dim">(×900 = 1초에 1일)</span></div>` : '';

  let mine = '<div class="panel">당신은 관전 중입니다 (문파 없음).</div>';
  if (mySectName) {
    const c = sects[mySectName].counts;
    const total = c.reduce((a, b) => a + b, 0);
    const rows = REALMS.map((r, i) => `<tr><td>${r}</td><td>${c[i].toLocaleString()}</td></tr>`).reverse().join('');
    mine = `<div class="panel"><h2>🏯 내 문파: ${mySectName}</h2>
      <div class="dim">${SECTS[mySectName].desc}</div>
      <table style="margin-top:8px"><tr><th>경지</th><th>무인 수</th></tr>${rows}
      <tr><th>합계</th><th>${total.toLocaleString()}</th></tr></table></div>`;
  }

  // 천하 형세: 모든 문파의 최고 경지 + 절정 이상 인원(강자 표시)
  const world = Object.keys(sects).map(name => {
    const s = sects[name], c = s.counts;
    let top = 0; for (let i = c.length - 1; i >= 0; i--) if (c[i] > 0) { top = i; break; }
    const elite = c.slice(3).reduce((a, b) => a + b, 0);
    const total = c.reduce((a, b) => a + b, 0);
    const isMe = s.owner === me.id;
    const tag = s.owner === 'AI' ? '<span class="tag ai">AI</span>' : `<span class="tag ${isMe ? 'me' : ''}">${esc(s.ownerName)}</span>`;
    return { name, tag, top, topCount: c[top], elite, total };
  }).sort((a, b) => b.top - a.top || b.topCount - a.topCount || b.elite - a.elite);

  const worldRows = world.map(w =>
    `<tr><td>${w.name}${w.tag}</td><td>${REALMS[w.top]} ${w.topCount}명</td><td>${w.elite.toLocaleString()}</td><td>${w.total.toLocaleString()}</td></tr>`
  ).join('');

  return `
    <div class="panel top"><div><h1>⚔️ 강호대전</h1></div>
      <div style="min-width:220px"><b>${t.day}일차</b> <span class="dim">다음 날까지 ${t.left}</span>
        <div class="bar"><div style="width:${t.pct}%"></div></div></div></div>
    ${speedBtns ? `<div class="panel">${speedBtns}</div>` : ''}
    ${mine}
    <div class="panel"><h3>천하 형세 (강자 순)</h3>
      <table><tr><th>문파</th><th>최고 경지</th><th>절정 이상</th><th>전체 인원</th></tr>${worldRows}</table></div>`;
}

boot();
</script>
</body>
</html>
