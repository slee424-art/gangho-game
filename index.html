<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<title>강호대전: 천하쟁패 — 강호 대전략</title>
<style>
  :root { --bg:#14110f; --panel:#221c18; --line:#4a3a2c; --gold:#d9b46c; --text:#eadfce; --dim:#9a8b78; --red:#c0503c; --green:#6fae6a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  h1,h2,h3 { color:var(--gold); margin:0 0 10px; }
  #app { max-width:1420px; margin:0 auto; padding:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .card { background:#2b231d; border:1px solid var(--line); border-radius:8px; padding:10px; cursor:pointer; }
  .card:hover { border-color:var(--gold); }
  .card.mine { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .card.taken { opacity:.55; cursor:not-allowed; }
  .card b { color:var(--gold); font-size:17px; }
  .dim { color:var(--dim); font-size:13px; }
  .red { color:var(--red); } .green { color:var(--green); } .gold { color:var(--gold); }
  button { background:var(--gold); color:#2a1d0c; border:0; border-radius:6px; padding:7px 12px; font-weight:700; cursor:pointer; margin:2px; }
  button.sub { background:#3a2f26; color:var(--text); border:1px solid var(--line); }
  button.on { outline:2px solid var(--gold); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child,td:first-child { text-align:left; }
  .bar { height:10px; background:#3a2f26; border-radius:5px; overflow:hidden; }
  .bar > div { height:100%; background:var(--gold); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#3a2f26; margin-left:6px; }
  .tag.ai { color:var(--dim); } .tag.me { color:#2a1d0c; background:var(--gold); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .log div { font-size:13px; padding:2px 0; border-bottom:1px dashed #3a2f26; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#000c; border:1px solid var(--gold); padding:8px 16px; border-radius:20px; }
  svg text { font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  .map-legend{display:flex;gap:14px;flex-wrap:wrap;color:#c5b58f;font-size:12px;margin-top:8px}
  .map-frame{background:linear-gradient(135deg,#26352e,#171d1c);border:1px solid #806b45;border-radius:14px;padding:8px;box-shadow:0 10px 28px #0005}
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .objective {display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:linear-gradient(110deg,#34291b,#1d211e);border:1px solid #9a7843;border-radius:9px;padding:9px 12px;margin-bottom:10px}
  .core-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;margin:2px;border:1px solid #8d7147;border-radius:14px;background:#30271d;font-size:12px}
  .core-pill.dead{opacity:.45;text-decoration:line-through;border-color:#77463d}
  .map-frame{overflow-x:auto;background:radial-gradient(ellipse at 50% 42%,#c7b88e 0%,#a79a73 58%,#716c51 100%);border:1px solid #a88a52;border-radius:14px;padding:8px;box-shadow:0 14px 40px #0009,inset 0 0 0 2px #d4b77a22}

const appEl = document.getElementById('app');
let Playroom;
{
  const pick = m => [m, m && m.default, m && m.Playroom].find(x => x && typeof x.insertCoin === 'function');
  const sources = [
    'https://esm.sh/playroomkit',
    'https://cdn.jsdelivr.net/npm/playroomkit/+esm',
    'https://esm.run/playroomkit',
    'https://cdn.skypack.dev/playroomkit',
    'https://unpkg.com/playroomkit?module',
  ];
  const errors = [];
  for (const url of sources) {
    try {
      const found = pick(await import(url));
      if (found) { Playroom = found; break; }
      errors.push(url + ' → insertCoin 없음');
    } catch (e) { errors.push(url + ' → ' + String(e && e.message || e)); }
  }
  if (!Playroom) {
    for (const url of ['https://cdn.jsdelivr.net/npm/playroomkit/multiplayer.umd.js', 'https://unpkg.com/playroomkit/multiplayer.umd.js']) {
      try {
        await new Promise((ok, no) => { const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = () => no(new Error('불러오기 실패')); document.head.appendChild(s); });
        const found = pick(window.Playroom) || pick(window.PlayroomKit);
        if (found) { Playroom = found; break; }
        errors.push(url + ' → insertCoin 없음');
      } catch (e) { errors.push(url + ' → ' + String(e && e.message || e)); }
    }
  }
  if (!Playroom) {
    appEl.innerHTML = '<div class="panel">라이브러리 로드 실패<br><span class="dim">' + errors.map(s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>') +

    throw new Error('Playroom load failed');
  }
  window.Playroom = Playroom;
}
window.addEventListener('error', ev => {
  appEl.innerHTML = '<div class="panel">오류: ' + String(ev.message) + '</div>';
});
window.addEventListener('unhandledrejection', ev => {

function resolveMarch(W, m) {
  const att = W.sects[m.sect], day = W.d;

  const to = m.to, node = W.nodes[to];

    } else if (!hq) {
      const siege = node.siege && node.siege.sect === att.name ? node.siege : { sect: att.name, progress: 0 };
      siege.progress = Math.min(2, siege.progress + 1);
      node.siege = siege;
      if (siege.progress >= 2) {
        node.owner = att.name; node.garrison = REALMS.map(() => 0); node.siege = null;
        logPush(W, `🏴 [${att.name}] ${to} 최종 점령! 두 차례의 승리 끝에 영토를 확보했다 ${stat}`, 'war');
      } else {
        logPush(W, `⚔️ [${att.name}] ${to} 전투 승리! 포위 진척 ${siege.progress}/2 — 아직 점령하지 못했다 ${stat}`, 'war');
      }
    } else {
      const siege = node.siege && node.siege.sect === att.name ? node.siege : { sect: att.name, progress: 0 };

}

function assassinate(W, name, targetName) {

  s.lastAssDay = W.d;
  if (rnd() < p) {
    t.leaderDead = true; t.leaderDeadDay = W.d;
    for (let i = 0; i < 9; i++) t.counts[i] -= Math.floor(t.counts[i] * 0.03);
    fixOrgs(t);

}

function pickTarget(W, name) {
  const mine = ownedNodes(W, name); let best = null;
  for (const id in NODES) {

    if (!ADJ[id].some(a => mine.includes(a))) continue;
    const p = defPowerOf(W, id, W.d);
    if (!best || p < best.power) best = { id, power: p };
  }
  return best;
}

function aiAct(W, name) {
  const s = W.sects[name];
  if (s.defeated || s.owner !== 'AI') return;
  // AI는 매일 전쟁보다 내정·방비를 우선한다.
  let budget = Math.floor(s.gold * 0.45);
  for (const i of [3, 2, 4, 1, 0]) {
    const cost = TRAIN_COST[i], n = Math.min(6, s.counts[i], Math.floor(budget / cost));
    if (n > 0) { const ok = i >= 2 ? Array.from({ length: n }).filter(() => rnd() < 1 / 3).length : n; s.counts[i] -= ok; s.counts[i + 1] += ok; s.gold -= n * cost; budget -= n * cost; }
  }
  const rec = Math.min(10, Math.floor(budget * 0.35 / RECRUIT_COST));
  if (rec > 0) { s.counts[0] += rec; s.gold -= rec * RECRUIT_COST; }
  const nw = WEAPONS[s.weapon + 1];
  if (nw && s.gold >= nw.cost * 1.8 && rnd() < 0.35) { s.gold -= nw.cost; s.weapon++; }
  if (rnd() < 0.35) {
    const ai = Math.floor(rnd() * 3);

  if (coreIds.length && rnd() < 0.42) {

    const level = W.nodes[target].fortLevel || 0, cost = 900 * (level + 1) * (level + 1);

  const threatened = coreIds.find(id => W.nodes[id].siege && W.nodes[id].siege.progress > 0);

    const n = Math.min(100, s.counts[0]); s.counts[0] -= n; W.nodes[threatened].garrison[0] = (W.nodes[threatened].garrison[0] || 0) + n;

  if (W.marches.filter(m => m.sect === name).length < 1 && rnd() < 0.045) {

    if (!coreUnderThreat && t && (power(makeUnits(s, 'all')) + prodigyPower(s)) * atkMult(s) >= t.power * 1.9) launch(W, name, t.id, 'all');
  }
}
function applyDeficitAttrition(W, s) {
  // 전체 인구에는 본대, 출정군, 주둔군이 포함된다. 조직 인원은 counts[0]에 이미 포함.
  const pools = [{ units: s.counts, kind: 'main' }];
  for (const id in W.nodes) {
    const n = W.nodes[id];
    if (n.owner === s.name && n.garrison) pools.push({ units: n.garrison, kind: 'garrison', id });
  }
  for (const m of W.marches) if (m.sect === s.name) pools.push({ units: m.units, kind: 'march', id: m.id });
  const total = pools.reduce((a, p) => a + sum(p.units), 0);
  let leaving = Math.min(total, Math.ceil(total * 0.03));
  const initial = leaving;
  // 하급 무인부터 이탈한다. 본대가 부족하면 주둔군과 출정군에서도 빠진다.
  for (let rank = 0; rank < REALMS.length && leaving > 0; rank++) {
    for (const pool of pools) {
      const take = Math.min(leaving, pool.units[rank] || 0);
      if (take > 0) { pool.units[rank] -= take; leaving -= take; }
      if (!leaving) break;
    }
  }
  fixOrgs(s);
  logPush(W, `📉 [${s.name}] 재정 적자: 문파 인원 ${num(initial)}명(3%)이 이탈했다.`, 'war');
}

function triggerWorldEvent(W,day){
  ensureMeta(W); if(rnd()>.075)return;
  const e=GRAND_EVENTS[Math.floor(rnd()*GRAND_EVENTS.length)], names=Object.keys(W.sects).filter(n=>!W.sects[n].defeated);
  const target=names[Math.floor(rnd()*names.length)]; if(!target)return;
  const s=W.sects[target];
  if(e[2]==='pill') s.gold+=1800;
  if(e[2]==='manual'){s.gold+=900;s.renown=(s.renown||0)+3;}
  if(e[2]==='threat'){s.alert=(s.alert||0)+1;}
  if(e[2]==='relic'){s.renown=(s.renown||0)+12;s.weapon=Math.min(WEAPONS.length-1,(s.weapon||0)+1);}
  if(e[2]==='genius'){s.counts[2]+=8;s.renown=(s.renown||0)+5;}
  if(e[2]==='chaos') for(const k in W.meta.relations){if(W.meta.relations[k].kind==='alliance')W.meta.relations[k].trust=Math.max(0,(W.meta.relations[k].trust||0)-2);}
  W.meta.events.unshift({day,title:e[0],desc:e[1],target});W.meta.events=W.meta.events.slice(0,12);
  logPush(W,`🌩️ 강호 사건: ${e[0]} — [${target}] ${e[1]}`,'war');
}
function dailyPolitics(W,day){
  ensureMeta(W);
  for(const name in W.sects){const s=W.sects[name];if(s.defeated)continue;
    const unrest=W.meta.politics[name]||0;
    if(rnd()<(0.008+unrest*0.012)){
      if(s.gold>=500){s.gold-=500;W.meta.politics[name]=Math.max(0,unrest-1);logPush(W,`🏯 [${name}] 장로 회의를 통해 내부 갈등을 수습했다.`,'sys');}
      else {const lost=Math.min(s.counts[0],Math.ceil(sum(s.counts)*.02));s.counts[0]=Math.max(0,s.counts[0]-lost);W.meta.politics[name]=Math.min(5,unrest+1);logPush(W,`⚠️ [${name}] 장로 파벌의 반발로 제자 ${lost}명이 이탈했다.`,'war');}
    }
  }
  for(const k in W.meta.relations){const r=W.meta.relations[k];if(r.kind==='alliance'&&r.days>0){r.days--;if(r.days===0){r.kind='neutral';logPush(W,`🤝 동맹 기간 만료: ${k.replace('|',' · ')}`,'sys');}}}
}
function updateVictoryScores(W){
  ensureMeta(W); const living=Object.values(W.sects).filter(s=>!s.defeated);
  for(const s of living){const land=ownedNodes(W,s.name).length, renown=s.renown||0, allies=Object.entries(W.meta.relations).filter(([k,r])=>k.split('|').includes(s.name)&&['alliance','vassal'].includes(r.kind)).length;
    s.victoryScores={military:land,economic:Math.floor(Math.max(0,s.gold)/5000),diplomacy:allies,renown};
  }
}
function secretDiscoveries(W,day){
  ensureMeta(W); if(W.meta.secret.discovered||day<12||rnd()>.018)return;
  const names=Object.keys(W.sects).filter(n=>!W.sects[n].defeated);if(!names.length)return;
  const n=names[Math.floor(rnd()*names.length)],s=W.sects[n];W.meta.secret.discovered={day,sect:n,item:'천하제일검',owner:s.owner};s.weapon=WEAPONS.length-1;s.renown=(s.renown||0)+25;
  logPush(W,`🗝️ 비밀 발견! [${n}]이(가) 전설의 무기 「천하제일검」을 발견했다!`,'war');
}

function dailyUpdate(W, day) {
  W.d = day;
  const herbBy = {};
  for (const id in W.nodes) if (NODES[id].type === 'herb' && W.nodes[id].owner) herbBy[W.nodes[id].owner] = (herbBy[W.nodes[id].owner] || 0) + 1;
  for (const name in W.sects) {
    const s = W.sects[name];
    if (s.defeated) continue;
    // 하루 정산: 총수입을 받고 전체 무인 유지비를 실제로 차감한다.
    s.gold += grossOf(W, s) - upkeepOf(s);
    if (s.gold < 0) applyDeficitAttrition(W, s);
    if (s.leaderDead && day - s.leaderDeadDay >= 3) { s.leaderDead = false; logPush(W, `👑 [${name}] 새 장문인을 추대했다`, 'sys'); }
    if (s.academy) {
      s.academy.days--;
      if (s.academy.days <= 0) {
        s.counts[2] += s.academy.count;
        logPush(W, `🎓 [${name}] 10대제자 수련원에서 제자 ${s.academy.count}명이 일류 무인으로 졸업했다!`, 'war');
        s.academy = null;
      }
    }
    if (s.prodigy && s.prodigy.realm < 8 && rnd() < 0.5) {
      s.prodigy.realm++;
      logPush(W, `🌠 [${name}]의 천외기인 「${s.prodigy.name}」이(가) 기연을 깨우쳐 ${REALMS[s.prodigy.realm]}에 도달했다!`, 'war');
    }
    const mult = (s.leaderDead ? 0.5 : 1) * (SECTS[name].talent || 1) * ((SECTS[name].traits && SECTS[name].traits.stats.promote) || 1) * (1 + Math.min(0.5, (s.orgs['제자단'] || 0) / 200) + 0.05 * (herbBy[name] || 0));
    for (let i = 7; i >= 0; i--) {
      const highRealmGate = i >= 4 ? 0.08 * (SECTS[name].highTalent || 1) : 1;
      const exact = s.counts[i] * PROMOTE[i] * mult * highRealmGate;
      let n = Math.floor(exact);
      if (rnd() < exact - n) n++;
      n = Math.min(n, s.counts[i]);
      s.counts[i] -= n; s.counts[i + 1] += n;
      if (n > 0 && i + 1 >= 5) logPush(W, `🌟 [${name}]에서 ${n}명이 ${REALMS[i + 1]}에 올랐다`, 'sys');
    }
    s.counts[0] += Math.max(1, Math.round((3 + SECTS[name].base[0] * 0.004) * ((SECTS[name].traits && SECTS[name].traits.stats.recruit) || 1)));
    fixOrgs(s);
    s.peak = Math.max(s.peak, sum(s.counts));
  }
  for (const name in W.sects) aiAct(W, name);
  if (day > 1 && day % 30 === 0) runMartialTournament(W, day);
  triggerWorldEvent(W,day); dailyPolitics(W,day); secretDiscoveries(W,day); updateVictoryScores(W);
}

function runMartialTournament(W, day) {
  const contenders = Object.values(W.sects).filter(s => !s.defeated && sum(s.counts) > 0);
  if (contenders.length < 2) return;
  const ranked = contenders.map(s => ({s, score: Math.max(1, sectPower(s, s.counts) * (0.85 + rnd()*0.3))}))
    .sort((a,b) => b.score-a.score);
  const winner = ranked[0].s;
  const reward = 2500 + Math.min(15000, Math.floor(power(winner.counts) * 0.015));
  winner.gold += reward;
  winner.renown = (winner.renown || 0) + 10;
  W.tournaments = W.tournaments || [];
  W.tournaments.unshift({day, winner:winner.name, ownerName:winner.ownerName, reward, top3:ranked.slice(0,3).map(x=>x.s.name)});
  W.tournaments = W.tournaments.slice(0,8);
  logPush(W, `🏆 제${Math.ceil(day/30)}회 무림대회 우승: [${winner.name}] ${winner.ownerName} · 상금 ${num(reward)}금`, 'war');
}

function checkEnd(W) {
  const alive = Object.keys(W.sects).filter(n => !W.sects[n].defeated);
  if (alive.length === 1) { const w=W.sects[alive[0]]; W.winner={owner:w.owner,ownerName:w.ownerName,sects:alive,method:'무력 통일'}; return; }
  ensureMeta(W);
  for (const name of alive) {
    const s=W.sects[name], land=ownedNodes(W,name).length;
    const allies=Object.entries(W.meta.relations).filter(([k,r])=>k.split('|').includes(name)&&['alliance','vassal'].includes(r.kind)).length;
    const renown=s.renown||0;
    let method='';
    if (land>=Math.ceil(Object.keys(W.nodes).length*.62)) method='무력 패권';
    else if (s.gold>=250000 && grossOf(W,s)>upkeepOf(s)) method='경제 패권';
    else if (allies>=5) method='외교 패권';
    else if (renown>=100) method='명성 제패';
    if(method){W.winner={owner:s.owner,ownerName:s.ownerName,sects:[name],method};logPush(W,`👑 [${name}] ${method} 달성! 강호의 패권을 차지했다.`,'war');return;}
  }
}

function rankOf(s) { const p = power(s.counts); let i = 0; RANKS.forEach((r, k) => { if (p >= r[0]) i = k; }); return { i, label: RANKS[i][1], next: RANKS[i + 1], p }; }
const SUR = ['남궁','제갈','모용','독고','황보','하후','단목','사마','연','백','유','한','진','소','청','천','위','곽'];
const GIV = ['천','운','현','진','태','검','무','광','혁','도','린','준','성','하','량','태소','청휘','무진','백야','한서'];
const ALA = ['천하무적','신검','벽력','혈수','광풍','청영','철권','금강','태허','현천','적염','백운','야차','천외','신룡','무상','일월','구천','비검','파천'];
const ALB = ['검왕','도황','권제','장군','검성','마존','신수','일검','창신','선인','패왕','검선','천존','귀검','제일검'];
const pickA = a => a[Math.floor(rnd() * a.length)];
function masterStats(m, s) {
  const r = m.realm, k = 1 + 0.12 * (m.pills || 0), st = SECTS[s.name].traits.stats;
  return { hp: Math.round(POWER[r] * 7 * m.roll * k), qi: Math.round([0,0,0,0,0,0,3,6,12][r] * m.roll * k * 10) / 10, atk: Math.round(POWER[r] * 1.2 * m.roll * k * st.atk) };
}
function newMaster(W, s, r) {
  const used = new Set(); for (const n in W.sects) (W.sects[n].masters || []).forEach(m => used.add(m.alias));
  let al; for (let k = 0; k < 30; k++) { al = pickA(ALA) + pickA(ALB); if (!used.has(al)) break; }
  return { id: 'm' + Math.floor(rnd() * 1e9).toString(36), name: pickA(SUR) + pickA(GIV), alias: al, realm: r, roll: +(0.85 + rnd() * 0.3).toFixed(2), pills: 0 };
}
// 현경 이상 인원수(counts)와 이름 있는 고수 명단을 맞춘다. 출정·주둔 중인 인원도 포함해서 센다.
function syncMasters(W, s) {
  if (s.defeated) { s.masters = []; return; }
  const M = s.masters = s.masters || [], tot = REALMS.map((_, i) => s.counts[i]);
  for (const m of W.marches) if (m.sect === s.name) m.units.forEach((u, i) => tot[i] += u);
  for (const id in W.nodes) { const n = W.nodes[id]; if (n.owner === s.name && n.garrison) n.garrison.forEach((u, i) => tot[i] += u || 0); }
  const st = m => masterStats(m, s).atk;
  for (let r = 8; r >= 6; r--) {
    const L = M.filter(m => m.realm === r);
    while (L.length < tot[r]) {
      const low = r > 6 ? M.filter(m => m.realm === r - 1) : [];
      if (low.length > tot[r - 1]) { const m = low.sort((a, b) => st(b) - st(a))[0]; m.realm = r; L.push(m); logPush(W, `🌟 [${s.name}] 「${m.alias}」 ${m.name}이(가) ${REALMS[r]}에 올랐다!`, 'war'); }
      else { const m = newMaster(W, s, r); M.push(m); L.push(m); logPush(W, `🌟 [${s.name}] ${m.name}이(가) ${REALMS[r]}에 올라 「${m.alias}」(이)라는 별호를 얻었다!`, 'war'); }
    }
    while (L.length > tot[r]) { L.sort((a, b) => st(a) - st(b)); const m = L.shift(); M.splice(M.indexOf(m), 1); logPush(W, `⚰️ [${s.name}] 「${m.alias}」 ${m.name}이(가) 전사했다`, 'war'); }
  }
}

let players = [];
const ui = { tab: 'map', node: null, toast: '', toastAt: 0, vb: [0, 0, MAPW, MAPH] };
let lastTick = null, cmdCounter = 0, lastHtml = '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Math.round(n).toLocaleString();
const get = k => Playroom.getState(k);

function toast(t) { ui.toast = t; ui.toastAt = Date.now(); }

async function boot() {
  try {
    await Playroom.insertCoin({
      maxPlayersPerRoom: MAX_PLAYERS,
      defaultPlayerStates: { sect: '' },
    });
  } catch (e) {
    $root.innerHTML = '<div class="panel">접속 실패: ' + esc(e.message || e) + '</div>';
    return;
  }
  window.__ready = true;
  Playroom.onPlayerJoin(player => {
    players.push(player);
    player.onQuit(() => { players = players.filter(p => p !== player); });
  });
  if (Playroom.isHost()) {
    if (!get('phase')) Playroom.setState('phase', 'select', true);
    if (!get('speed')) Playroom.setState('speed', 1, true);
    if (get('elapsed') == null) Playroom.setState('elapsed', 0, true);
  }
  setInterval(render, 500);
  animate();
  setInterval(hostTick, 1000);
  render();
}
const $root = appEl;

/* ---------- 방장: 시간 + 명령 처리 + 일일 갱신 ---------- */
function loadWorld() {
  const sects = get('sects'), nodes = get('nodes');
  if (!sects || !nodes) return null;
  return { sects: clone(sects), nodes: clone(nodes), marches: clone(get('marches') || []), battles: clone(get('battles') || []), log: clone(get('log') || []), tournaments: clone(get('tournaments') || []), meta: clone(get('meta') || {relations:{},events:[],secret:{},politics:{}}),
           colors: get('colors') || {}, nextId: get('nextId') || 0, elapsed: 0, d: 1 };
}

function hostTick() {
  if (!Playroom.isHost() || get('phase') !== 'play') { lastTick = null; return; }
  const now = Date.now();
  if (lastTick === null) { lastTick = now; return; }
  const dt = Math.min(300, (now - lastTick) / 1000); lastTick = now;
  const elapsed = (get('elapsed') || 0) + dt * (get('speed') || 1);
  Playroom.setState('elapsed', elapsed, true);

  const W = loadWorld(); if (!W) return;
  ONLINE = new Set(players.map(p => p.id));
  W.elapsed = elapsed; W.d = Math.floor(elapsed / DAY_SECONDS) + 1;
  const before = JSON.stringify([W.sects, W.nodes, W.marches, W.battles, W.log, W.nextId, W.tournaments, W.meta]);

  // 1) 플레이어 명령
  const proc = clone(get('proc') || {}); let procChanged = false;
  for (const p of players) {
    const q = p.getState('cmds') || [], last = proc[p.id] || 0;
    for (const c of q) {
      if (c.seq > (proc[p.id] || 0)) { applyCmd(W, p.id, c); proc[p.id] = c.seq; procChanged = true; }
    }
  }
  if (procChanged) Playroom.setState('proc', proc, true);

  // 2) 도착한 병력 전투
  const due = W.marches.filter(m => m.arriveAt <= elapsed);
  W.marches = W.marches.filter(m => m.arriveAt > elapsed);
  for (const m of due) startBattle(W, m);
  simulateBattles(W, dt * (get('speed') || 1));

  // 3) 하루가 지났으면 일일 갱신
  const realDay = W.d;
  let done = get('processedDay') || 1; const startDone = done;
  while (done < realDay) { done++; dailyUpdate(W, done); }
  W.d = realDay;
  if (done !== startDone) Playroom.setState('processedDay', done, true);

  for (const n in W.sects) syncMasters(W, W.sects[n]);
  checkEnd(W);

  if (JSON.stringify([W.sects, W.nodes, W.marches, W.battles, W.log, W.nextId, W.tournaments, W.meta]) !== before) {
    Playroom.setState('sects', W.sects, true);
    Playroom.setState('nodes', W.nodes, true);
    Playroom.setState('marches', W.marches, true);
    Playroom.setState('battles', W.battles || [], true);
    Playroom.setState('log', W.log, true);
    Playroom.setState('nextId', W.nextId, true);
    Playroom.setState('tournaments', W.tournaments || [], true);
    Playroom.setState('meta', W.meta || {}, true);
  }
  if (W.winner) { Playroom.setState('winner', W.winner, true); Playroom.setState('phase', 'end', true); }
}

/* ---------- 행동 ---------- */
function pickSect(name) {
  const takenBy = players.find(p => p.getState('sect') === name);
  if (takenBy && takenBy.id !== Playroom.myPlayer().id) return;
  Playroom.myPlayer().setState('sect', name, true);
}

function startGame() {
  if (!Playroom.isHost()) return;
  const picks = {};
  for (const name in SECTS) {
    const o = players.find(p => p.getState('sect') === name);
    if (o) picks[name] = { id: o.id, name: o.getProfile().name };
  }
  const W = makeWorld(picks);
  logPush(W, '🔥 천하쟁패가 시작되었다! 각 문파의 본산과 핵심 거점 2곳, 총 3곳을 모두 파괴해야 멸문한다.', 'sys');
  const proc = {};
  for (const p of players) { const q = p.getState('cmds') || []; proc[p.id] = q.length ? q[q.length - 1].seq || 0 : 0; }
  Playroom.setState('proc', proc, true);
  Playroom.setState('sects', W.sects, true);
  Playroom.setState('nodes', W.nodes, true);
  Playroom.setState('marches', [], true);
  Playroom.setState('battles', [], true);
  Playroom.setState('log', W.log, true);
  Playroom.setState('colors', W.colors, true);
  Playroom.setState('nextId', 0, true);
  Playroom.setState('tournaments', [], true);
  Playroom.setState('meta', {relations:{},events:[],secret:{},politics:{},arena:{},rivals:{}}, true);
  Playroom.setState('processedDay', 1, true);
  Playroom.setState('elapsed', 0, true);
  Playroom.setState('winner', null, true);
  Playroom.setState('phase', 'play', true);
}

function send(c) {
  const me = Playroom.myPlayer();
  const q = (me.getState('cmds') || []).slice(-14);
  q.push(Object.assign({}, c, { seq: Date.now() * 100 + (cmdCounter++ % 100) }));
  me.setState('cmds', q, true);
  toast('명령을 보냈어요');
}

$root.addEventListener('click', e => {
  const unitEl=e.target.closest('[data-unit]'); if(unitEl && !unitEl.dataset.act){ui.battleUnit=unitEl.dataset.unit;return;}
  const field=e.target.closest('[data-battle-field]'); if(field){const r=field.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*1000,y=(e.clientY-r.top)/r.height*800;send({t:'battleOrder',id:Number(field.dataset.battleField),unit:ui.battleUnit||'all',order:'move',x,y});return;}
  const el = e.target.closest('[data-act]');
  if (!el || Date.now() < (ui.noClickUntil || 0)) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab': ui.tab = d.tab; break;
    case 'selectBattleUnit': ui.battleUnit=d.unit||'all'; break;
    case 'zoom': if (d.f === '0') ui.vb = [0, 0, MAPW, MAPH]; else zoomAt(Number(d.f), .5, .5); break;
    case 'home': { const W = readWorld(), m = W && mySect(W); if (m) { const N = NODES[m.name]; ui.vb = [N.x - 450, N.y - 300, 900, 600]; clampVB(); } break; }
    case 'buyPill': send({ t: 'buyPill', i: Number(d.i) }); break;
    case 'givePill': send({ t: 'givePill', i: Number(d.i), mid: d.m || '' }); break;
    case 'node': ui.node = d.id; break;
    case 'pick': pickSect(d.name); break;
    case 'start': startGame(); break;
    case 'speed': if (Playroom.isHost()) Playroom.setState('speed', Number(d.v), true); break;
    case 'recruit': send({ t: 'recruit', n: Number(d.n) }); break;
    case 'train': send({ t: 'train', i: Number(d.i), n: Number(d.n) }); break;
    case 'academy': send({ t: 'academy' }); break;
    case 'org': send({ t: 'org', o: d.o, d: Number(d.d) }); break;
    case 'art': send({ t: 'art', i: Number(d.i) }); break;
    case 'weapon': send({ t: 'weapon' }); break;
    case 'march': send({ t: 'march', to: d.to, mode: d.mode }); break;
    case 'battleOrder': send({t:'battleOrder',id:Number(d.id),unit:d.unit||'all',order:d.order}); break;
    case 'fort': send({ t: 'fort', to: d.to }); break;
    case 'garrison': send({ t: 'garrison', to: d.to, i: Number(d.i), n: Number(d.n) }); break;
    case 'withdraw': send({ t: 'withdraw', to: d.to, i: Number(d.i), n: Number(d.n) }); break;
    case 'kill': send({ t: 'kill', target: d.target }); break;
    case 'diplomacy': send({t:'diplomacy',target:d.target,kind:d.kind}); break;
    case 'politics': send({t:'politics',kind:d.kind}); break;
  }
  render();
});

function render() {
  if (ui.down) return;   // 버튼을 누르는 중에는 화면을 다시 그리지 않는다(클릭 씹힘 방지)
  ONLINE = new Set(players.map(p => p.id));
  const phase = get('phase');

  for (const [p, sp, off, sc] of SHIPS) svg += `<g data-ship="${p}" data-sp="${sp}" data-off="${off}" data-sc="${sc}" transform="translate(-99 -99)"><path d="M-13 0 L13 0 L8 7 L-8 7Z" fill="#7a5632" stroke="#2b1d10"/><path d="M1 -1 L1 -19 L12 -5Z" fill="#f1e6c6" stroke="#8b7a55"/><path d="M-1 -1 L-1 -16 L-9 -4Z" fill="#d7c79c" stroke="#8b7a55"/></g>`;
  for (const m of W.marches) {
    const f = NODES[m.from], t = NODES[m.to], s = W.sects[m.sect], pr = Math.min(1, Math.max(0, (el - m.start) / Math.max(1, m.arriveAt - m.start))), x = f.x + (t.x - f.x) * pr, y = f.y + (t.y - f.y) * pr;
    svg += `<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}" stroke="${s.color}" stroke-width="4" stroke-dasharray="8 6"/><circle cx="${x}" cy="${y}" r="9" fill="${s.color}" stroke="#fff" stroke-width="2"><title>${esc(m.sect)} 병력</title></circle><text x="${x}" y="${y + 5}" text-anchor="middle" font-size="12">⚔️</text>`;
  }
  for (const id in NODES) {
    if (!visible(id, day)) continue;
    const N = NODES[id], ns = W.nodes[id], own = ns.owner ? W.sects[ns.owner] : null;
    if (ns.destroyed) { svg += `<g opacity=".45"><circle cx="${N.x}" cy="${N.y}" r="11" fill="#171513" stroke="#9b5548" stroke-width="2"/><path d="M${N.x - 6} ${N.y - 6}l12 12m0 -12l-12 12" stroke="#b76a58" stroke-width="2"/><text x="${N.x}" y="${N.y + 25}" text-anchor="middle" font-size="11" fill="#d6a18d">파괴됨</text></g>`; continue; }
    const hq = !!SECTS[id], color = own ? own.color : '#8a7a60', r = hq ? 26 : (N.type === 'stronghold' ? 12 : (N.type === 'subsect' ? 15 : 16)), sel = ui.node === id;
    svg += `<g data-act="node" data-id="${id}" style="cursor:pointer"><title>${esc(id)}</title>`;
    if (attackable.has(id)) svg += `<circle cx="${N.x}" cy="${N.y}" r="${r + 10}" fill="none" stroke="#f0c768" stroke-width="2.5" stroke-dasharray="5 4"/>`;
    if (hq) svg += `<circle cx="${N.x}" cy="${N.y}" r="${r + 7}" fill="#000a" stroke="#d9b46c" stroke-width="2"/>`;
    if ((ns.fortLevel || 0) > 0) svg += `<circle cx="${N.x}" cy="${N.y}" r="${r + 5}" fill="none" stroke="#d7b96f" stroke-width="${1 + ns.fortLevel}" stroke-opacity=".8"/>`;
    svg += `<circle cx="${N.x}" cy="${N.y}" r="${r}" fill="${color}" stroke="${sel ? '#fff3c4' : '#d0bd91'}" stroke-width="${sel ? 3.5 : 1.6}"/><text x="${N.x}" y="${N.y + (hq ? 8 : 5)}" text-anchor="middle" font-size="${hq ? 26 : (N.type === 'stronghold' ? 13 : 17)}">${NODE_ICON[N.type]}</text>`;
    const label = N.type === 'stronghold' ? N.siteName : id;
    svg += `<text x="${N.x}" y="${N.y + r + (hq ? 24 : 15)}" text-anchor="middle" font-size="${hq ? 19 : (N.type === 'stronghold' ? 11 : 13)}" font-weight="${hq ? 700 : 400}" fill="#f6e7bd" stroke="#13201c" stroke-width="3.5" paint-order="stroke">${esc(label)}</text>`;
    if (hq && own && !own.defeated) svg += `<text x="${N.x}" y="${N.y + r + 40}" text-anchor="middle" font-size="12" fill="#e0c88f" stroke="#13201c" stroke-width="3" paint-order="stroke">${rankOf(own).label}${own.owner !== 'AI' ? ' · ' + esc(own.ownerName) : ''}</text>`;
    svg += '</g>';
  }
  svg += '</svg>';

  const info = ui.node ? nodeInfo(W, me, ui.node, attackable) : '<div class="dim">지도에서 지역을 눌러 보세요. 금색 점선 테두리는 출정 가능한 지역이에요. 일반 영토·산하 문파·본산·핵심 거점은 전투에서 2회 승리해야 점령하거나 무너뜨릴 수 있어요.</div>';
  const mine = me ? W.marches.filter(m => m.sect === me.name).map(m => `<div>🚩 ${m.to} 방면 행군 중 (도착까지 ${Math.max(0, Math.round(m.arriveAt - el))}초)</div>`).join('') : '';
  const objective = me ? `<div class="objective"><b class="gold">⚔️ 승리 조건</b><span>적 문파의 본산과 핵심 거점 2곳을 각각 두 차례 승리해 무너뜨리세요.</span></div>` : '';
  return `${objective}<div class="panel"><div class="row" style="margin-bottom:6px"><button class="sub" data-act="zoom" data-f="0.8">＋ 확대</button><button class="sub" data-act="zoom" data-f="1.25">－ 축소</button><button class="sub" data-act="zoom" data-f="0">전체 보기</button><button class="sub" data-act="home">🏯 내 문파로</button><span class="dim">드래그로 이동 · 휠로 확대/축소</span></div><div class="map-frame">${svg}</div><div class="map-legend"><span>◆ 문파 본산</span><span>⛩️ 산하 문파 (소속 문파 색상)</span><span>🛕 핵심 거점</span><span>◇ 자원 거점</span><span>━━ 행군로</span><span>금색 점선: 출정 가능</span><span>금색 외곽선: 방어 시설</span></div></div><div class="two"><div class="panel">${info}</div><div class="panel"><h3>내 출정 부대</h3>${mine || '<div class="dim">출정 중인 부대가 없어요 (최대 2개)</div>'}</div></div>`;
}

function nodeInfo(W, me, id, attackable) {
  const N = NODES[id], ns = W.nodes[id], own = ns.owner ? W.sects[ns.owner] : null;
  const scouts = me && (me.orgs['정찰대'] || 0) >= 10, ownMine = me && ns.owner === me.name;
  const def = defPowerOf(W, id, W.d);
  const siege = ns.siege;
  const defTxt = ownMine || scouts ? num(def) : fuzz(def, id + W.d);
  const hq = !!SECTS[id] && !W.sects[id].defeated, core = !!N.core;
  const garrison = ns.garrison || REALMS.map(() => 0), garrisonTotal = sum(garrison);
  let h = `<h3>${NODE_ICON[N.type]} ${id}</h3>
    <div class="dim">${NODE_LABEL[N.type]}${hq ? ' · ' + SECTS[id].desc : ''}</div>
    <div>소유: ${own ? `<b style="color:${own.color}">${own.name}</b> (${own.owner === 'AI' ? 'AI' : esc(own.ownerName)})` : '주인 없음'}</div>
    <div>하루 수입: 금 +${N.income}</div>
    <div>방어 전력: <b>${defTxt}</b>${!scouts && !ownMine ? ' <span class="dim">(정찰대 10명 이상이면 정확히 보임)</span>' : ''}</div>
    ${N.core ? `<div class="gold">핵심 거점 · 파괴 시 ${esc(N.sect)}의 3대 거점 중 1곳 제거</div>` : ''}
    ${ns.fortLevel ? `<div>방어 시설: <b class="gold">${ns.fortLevel}/3단계</b></div>` : ''}
    ${garrisonTotal ? `<div>주둔 병력: <b>${num(garrisonTotal)}명</b></div>` : ''}
    ${siege ? `<div class="gold">포위전: ${esc(siege.sect)} ${siege.progress}/2단계</div>` : ''}`;
  if (hq && own) {
    const strong = own.counts.map((c, i) => [REALMS[i], c]).slice(4).filter(x => x[1] > 0).map(x => `${x[0]} ${x[1]}명`).join(', ');
    h += `<div>강자: ${strong || '초절정 이상 없음'}</div><div>고수: ${(own.masters || []).map(m => '「' + esc(m.alias) + '」').join(' ') || '-'}</div>${own.leaderDead ? '<div class="red">장문인 전사 상태</div>' : ''}`;
    if (isOffline(own)) h += '<div class="dim">(접속 안 한 문파: 방어력 +30%)</div>';
  }
  if (me && ownMine && !ns.destroyed) {
    const level = ns.fortLevel || 0, fortCost = 900 * (level + 1) * (level + 1);
    h += `<div style="margin-top:10px;border-top:1px solid #4a3a2c;padding-top:8px"><b>🧱 방어 거점 건설 / 강화</b><div>${btn(`data-act="fort" data-to="${id}"`, level >= 3 ? '최대 강화' : `방어 시설 ${level+1}단계 건설 (${num(fortCost)}금)`, level >= 3 || me.gold < fortCost)} <span class="dim">최대 3단계 · 방어력 상승</span></div>`;
    h += `<div style="margin-top:8px"><b>🛡️ 병력 주둔 / 증원</b><div class="dim">보낼 병력의 경지별 인원만큼 본대에서 빠져 이 거점을 지킵니다.</div>`;
    const sendOptions = [[0,100,'삼류 100명'],[2,10,'일류 10명'],[3,1,'절정 1명'],[4,1,'초절정 1명'],[5,1,'화경 1명']];
    for (const [i,n,label] of sendOptions) h += btn(`data-act="garrison" data-to="${id}" data-i="${i}" data-n="${n}"`, label, me.counts[i] < n);
    const withdrawOptions = [[0,100,'삼류 100명 회수'],[2,10,'일류 10명 회수'],[3,1,'절정 1명 회수'],[4,1,'초절정 1명 회수'],[5,1,'화경 1명 회수']];
    for (const [i,n,label] of withdrawOptions) if ((garrison[i] || 0) >= n) h += btn(`data-act="withdraw" data-to="${id}" data-i="${i}" data-n="${n}"`, label);
    h += `</div></div>`;
  }
  if (me && attackable.has(id)) {
    const full = W.marches.filter(m => m.sect === me.name).length >= 2;
    const modes = [['mass', '대군 출진', '삼류~일류 80%'], ['elite', '정예 출진', '절정 이상 전원'], ['all', '전군 출진', '전체 70%']];
    h += '<div style="margin-top:8px"><b>출진</b></div>';
    for (const [m, label, desc] of modes) {
      const P = (power(makeUnits(me, m)) + (m !== 'mass' ? prodigyPower(me) : 0)) * atkMult(me);
      h += `<div>${btn(`data-act="march" data-to="${id}" data-mode="${m}"`, label, full || P <= 0)} <span class="dim">${desc} · 공격 전력 ${num(P)}</span></div>`;
    }
    if (full) h += '<div class="red">부대를 이미 2개 출정시켰어요</div>';
  } else if (me && ns.owner !== me.name) {
    h += '<div class="dim" style="margin-top:8px">내 영토와 맞닿아 있지 않아서 아직 공격할 수 없어요</div>';
  }
  return h;
}

    <div class="dim" style="margin-top:5px">문파 자질: ${SECTS[me.name].talentLabel || '일반 자질 보정 ×1.0'} · 문주 부재 시 승급 확률 50%</div>

    <div style="margin-top:8px">공격 배율 <b>×${atkMult(me).toFixed(2)}</b> · 방어 배율 <b>×${defMult(me).toFixed(2)}</b> · 전투력 합계 <b>${num(power(avail(me)))}</b></div></div>`;
}

/* ----- 조직 ----- */
function tabOrg(W, me) {
  const max = Math.floor(me.counts[0] * 0.8), used = orgTotal(me), scouts = (me.orgs['정찰대'] || 0) >= 10;
  const rows = ORGS.map(([n, d]) => `<tr><td>${n}<div class="dim">${d}</div></td><td>${num(me.orgs[n] || 0)}</td>
    <td style="text-align:left">${[-10, -1, 1, 10].map(x => btn(`data-act="org" data-o="${n}" data-d="${x}"`, (x > 0 ? '+' : '') + x)).join('')}</td></tr>`).join('');
  const ready = (me.orgs['암살대'] || 0) >= 5 && W.d > me.lastAssDay;
  const targets = Object.keys(W.sects).filter(n => n !== me.name && !W.sects[n].defeated && !W.sects[n].leaderDead).map(n => {
    const t = W.sects[n];
    return `<div>${btn(`data-act="kill" data-target="${n}"`, '암살 시도', !ready)} ${n} <span class="dim">(${t.owner === 'AI' ? 'AI' : esc(t.ownerName)}) 성공률 ${scouts ? Math.round(assassinChance(me, t) * 100) + '%' : '불명 (정찰대 필요)'}</span></div>`;
  }).join('');
  return `<div class="panel"><h3>👥 문파 조직</h3>
    <div class="dim">삼류 무인을 각 조직에 배치해요. 배치된 인원은 전투에 참가하지 않아요. (삼류의 80%까지 배치 가능) 배치 ${num(used)} / ${num(max)}</div>
    <table><tr><th>조직</th><th>인원</th><th style="text-align:left">조정</th></tr>${rows}</table></div>
    <div class="panel"><h3>🗡️ 암살 작전</h3>
    <div class="dim">암살대 5명 이상, 하루에 한 번. 성공하면 장문인이 전사해 그 문파가 크게 약해져요. 실패하면 암살대 60%를 잃어요. ${ready ? '' : '<span class="red">(지금은 불가능: 암살대 부족 또는 오늘 이미 시도)</span>'}</div>${targets || '<div class="dim">대상 없음</div>'}</div>`;
}

    <div class="panel"><h3>🗡️ 무기고</h3>
    <div>현재: <b class="gold">[${w.g}] ${w.n}</b> <span class="dim">공격 ×${w.atk} · 방어 +${Math.round(w.def * 100)}%</span></div>
    <div style="margin-top:6px">${nw ? btn('data-act="weapon"', `[${nw.g}] ${nw.n}(으)로 강화 (${num(nw.cost)}금)`, me.gold < nw.cost) + `<span class="dim"> 공격 ×${nw.atk} · 방어 +${Math.round(nw.def * 100)}%</span>` : '<span class="green">최고 등급입니다</span>'}</div></div>`;
}

/* ----- 천하 형세 ----- */

function tabJianghu(W,me){
  ensureMeta(W); const names=Object.keys(W.sects).filter(n=>n!==me.name&&!W.sects[n].defeated);
  const rel=names.map(n=>{const r=relation(W,me.name,n);return `<tr><td>${esc(n)}</td><td>${r.kind==='alliance'?'동맹':r.kind==='vassal'?'속국':'중립'}</td><td>${r.trust||0}</td><td>${btn(`data-act="diplomacy" data-target="${esc(n)}" data-kind="alliance"`,'동맹 제안')}${btn(`data-act="diplomacy" data-target="${esc(n)}" data-kind="vassal"`,'속국화 (1,500금)',me.gold<1500)}${btn(`data-act="diplomacy" data-target="${esc(n)}" data-kind="tribute"`,'조공 징수')}${btn(`data-act="diplomacy" data-target="${esc(n)}" data-kind="betray"`,'협약 파기')}</td></tr>`}).join('');
  const events=(W.meta.events||[]).map(e=>`<div style="padding:7px;border-bottom:1px solid var(--line)"><b class="gold">${e.day}일 · ${esc(e.title)}</b><div class="dim">${esc(e.desc)} (관련 문파: ${esc(e.target)})</div></div>`).join('');
  const scores=Object.values(W.sects).filter(s=>!s.defeated).map(s=>({s,sc:s.victoryScores||{}})).sort((a,b)=>(b.sc.renown||0)-(a.sc.renown||0)).map(({s,sc})=>`<tr><td>${esc(s.name)}</td><td>${sc.military||0}</td><td>${sc.economic||0}</td><td>${sc.diplomacy||0}</td><td>${sc.renown||s.renown||0}</td></tr>`).join('');
  const traits=SECTS[me.name].traits; const politics=(W.meta.politics&&W.meta.politics[me.name])||0;
  const tour=(W.tournaments||[]).map(t=>`<div>🏆 ${t.day}일 · <b class="gold">${esc(t.winner)}</b> 우승 · TOP3 ${t.top3.map(esc).join(' / ')}</div>`).join('')||'<div class="dim">30일마다 자동 개최됩니다.</div>';
  const secret=W.meta.secret&&W.meta.secret.discovered;
  return `<div class="panel"><h3>🌐 외교와 세력 관계</h3><div class="dim">동맹은 10일간 유지됩니다. 속국화는 상대의 동의 없이 영향권을 선언하는 초기 버전이며, 실제 조공 수입은 조공 명령으로 징수합니다.</div><table><tr><th>문파</th><th>관계</th><th>신뢰</th><th style="text-align:left">외교 행동</th></tr>${rel}</table></div>
  <div class="two"><div class="panel"><h3>🏯 문파 내부 정치</h3><div>내부 불만도: <b class="${politics>=3?'red':'gold'}">${politics}/5</b></div><div class="dim">불만이 높을수록 장로 반발과 제자 이탈 위험이 증가합니다.</div>${btn('data-act="politics" data-kind="council"','장로 회의 개최 (500금)',me.gold<500)}${btn('data-act="politics" data-kind="purge"','파벌 강제 정리 (제자 30명)',me.counts[0]<30)}</div>
  <div class="panel"><h3>🏮 문파 고유 특성</h3><div class="gold">${esc(me.name)}</div><div class="dim">${traits.pros.map(x=>'＋ '+esc(x)).join('<br>')}<br>${traits.cons.map(x=>'－ '+esc(x)).join('<br>')}</div><div style="margin-top:8px">명성: <b class="gold">${me.renown||0}</b></div></div></div>
  <div class="panel"><h3>🏆 무림대회와 강호 랭킹</h3>${tour}<div class="dim">후기지수·천하십대고수는 현재 문파 전투력 기반으로 자동 집계됩니다. 대회는 30일마다 열립니다.</div></div>
  <div class="panel"><h3>🗝️ 비경·기연·전설</h3>${secret?`<b class="gold">${esc(secret.item)}</b> 발견: ${esc(secret.sect)} · ${secret.day}일차`:'<div class="dim">아직 전설의 유적이 발견되지 않았습니다. 일정 기간이 지나면 비밀 기연이 나타날 수 있습니다.</div>'}<div class="dim">천년영약, 천하비급, 검성의 유적, 천재의 탄생 등 무작위 사건이 발생합니다.</div></div>
  <div class="panel"><h3>👑 다양한 승리 경쟁</h3><div class="dim">무력은 영토 수, 경제는 잔고, 외교는 동맹·속국 수, 명성은 대회와 기연으로 경쟁합니다. 최종 승리 선언은 기존 멸문·천하통일 규칙을 유지합니다.</div><table><tr><th>문파</th><th>영토(무력)</th><th>경제 점수</th><th>외교 점수</th><th>명성</th></tr>${scores}</table></div>`;
}

function tabWorld(W, me) { return tabWorld0(W, me) + hallOfMasters(W); }
function tabWorld0(W, me) {
  const scouts = me && (me.orgs['정찰대'] || 0) >= 10;
  const list = Object.keys(W.sects).map(n => W.sects[n]).filter(s => !s.defeated).map(s => {
    let top = 0; for (let i = 8; i >= 0; i--) if (s.counts[i] > 0) { top = i; break; }
    return { s, top, pw: power(s.counts) };
  }).sort((a, b) => b.top - a.top || b.pw - a.pw);
  const rows = list.map(({ s, top }) => {
    const mineRow = me && s.name === me.name, exact = mineRow || scouts;
    const strong = s.counts.map((c, i) => [REALMS[i], c]).slice(4).filter(x => x[1] > 0).map(x => `${x[0]} ${x[1]}`).join(' / ') || '-';
    const jeol = sum(s.counts.slice(3)), total = sum(s.counts);
    const cores = CORE_SITE_IDS[s.name].filter(id => !W.nodes[id].destroyed).length;
    const tag = s.owner === 'AI' ? '<span class="tag ai">AI</span>' : `<span class="tag ${mineRow ? 'me' : ''}">${esc(s.ownerName)}</span>`;
    return `<tr><td><span style="color:${s.color}">●</span> ${s.name}${tag}${s.prodigy ? ` <span class="gold">🌠 초월급 기인(${REALMS[s.prodigy.realm]})</span>` : ''}${s.leaderDead ? ' <span class="red">☠</span>' : ''}</td>
      <td>${REALMS[top]}</td><td style="text-align:left">${strong}</td>
      <td><b class="gold">${cores}/3</b></td><td>${exact ? num(jeol) : fuzz(jeol, s.name + 'j' + W.d)}</td><td>${exact ? num(total) : fuzz(total, s.name + 't' + W.d)}</td></tr>`;
  }).join('');
  const dead = Object.keys(W.sects).filter(n => W.sects[n].defeated).map(n => `${n}`).join(', ');
  const tourRows = (W.tournaments || []).map(t => `<tr><td>${t.day}일</td><td><b class="gold">${esc(t.winner)}</b></td><td>${esc(t.ownerName)}</td><td>+${num(t.reward)}금</td></tr>`).join('');
  return `<div class="panel"><h3>🌏 천하 형세 (강한 순)</h3>
    <div class="dim">각 문파는 본산 포함 핵심 거점 3곳을 보유합니다. 핵심 거점이 모두 파괴되면 해당 문파는 멸문합니다. 초절정 이상의 강자는 누구나 볼 수 있어요.</div>
    <table><tr><th>문파</th><th>최고 경지</th><th style="text-align:left">강자 (초절정 이상)</th><th>핵심 거점</th><th>절정 이상</th><th>전체</th></tr>${rows}</table>
    ${dead ? `<div class="dim" style="margin-top:8px">멸문: ${dead}</div>` : ''}</div>
    <div class="panel"><h3>🏆 무림대회 기록</h3><div class="dim">게임 내 30일마다 자동 개최 · 우승 문파는 상금과 명성을 얻습니다.</div><table><tr><th>개최일</th><th>우승 문파</th><th>문주</th><th>상금</th></tr>${tourRows || '<tr><td colspan="4" class="dim">첫 무림대회는 30일차에 열립니다.</td></tr>'}</table></div>`;
}

function financePanel(W, me) {
  const mult = (SECTS[me.name].traits && SECTS[me.name].traits.stats.income) || 1;
  const nodes = Object.keys(W.nodes).filter(id => W.nodes[id].owner === me.name && NODES[id].income > 0).sort((a, b) => NODES[b].income - NODES[a].income);
  const land = sum(nodes.map(id => NODES[id].income)), shop = (me.orgs['상단'] || 0) * 3;
  return `<div class="panel"><h3>💰 재정 (하루 기준)</h3><table>
    <tr><td>기본 수입</td><td>+150</td></tr><tr><td>상단 (${me.orgs['상단'] || 0}명 × 3)</td><td>+${num(shop)}</td></tr>
    <tr><td>영토 수입 (${nodes.length}곳)</td><td>+${num(land)}</td></tr><tr><td>문파 수입 보정</td><td>×${mult}</td></tr>
    <tr><td><b>총수입</b></td><td><b>${num(grossOf(W, me))}</b></td></tr><tr><td>인원 유지비</td><td class="red">−${num(upkeepOf(me))}</td></tr>
    <tr><td><b>하루 순수입</b></td><td><b class="${incomeOf(W, me) < 0 ? 'red' : 'gold'}">${incomeOf(W, me) > 0 ? '+' : ''}${num(incomeOf(W, me))}</b></td></tr></table>
    <div class="${incomeOf(W, me) < 0 ? 'red' : 'dim'}" style="margin-top:8px">${incomeOf(W, me) < 0 ? '⚠️ 적자 상태: 매일 문파 인원의 3%가 이탈합니다.' : '재정이 흑자입니다. 유지비를 감당할 수 있습니다.'}</div><div class="dim" style="margin-top:6px">영토: ${nodes.map(id => `${esc(id)} +${NODES[id].income}`).join(' · ') || '없음'}</div></div>`;
}
const mrow = (m, s, extra) => { const t = masterStats(m, s); return `<tr><td><b class="gold">「${esc(m.alias)}」</b> ${esc(m.name)}<span class="tag">${REALMS[m.realm]}</span>${m.pills ? `<span class="tag">영단 ${m.pills}회</span>` : ''}</td>${extra || ''}<td>${num(t.hp)}</td><td>${t.qi}갑자</td><td>${num(t.atk)}</td></tr>`; };
function tabPill(W, me) {
  const P = me.pills || {};
  const rows = [2, 3, 4, 5, 6, 7].map(i => `<tr><td><b>${PILL_NAME[i]}</b><div class="dim">${REALMS[i]} → ${REALMS[i + 1]}</div></td><td>${num(PILL_COST[i])}금</td><td>${P[i] || 0}</td><td style="text-align:left">${btn(`data-act="buyPill" data-i="${i}"`, '구매', me.gold < PILL_COST[i])}${btn(`data-act="givePill" data-i="${i}"`, '가장 강한 자에게', !(P[i] > 0) || me.counts[i] < 1)}</td></tr>`).join('');
  const ms = (me.masters || []).slice().sort((a, b) => b.realm - a.realm || masterStats(b, me).atk - masterStats(a, me).atk);
  const mr = ms.map(m => mrow(m, me, '')).join('') || '<tr><td colspan="4" class="dim">아직 현경에 오른 고수가 없습니다</td></tr>';
  const pick = ms.filter(m => m.realm < 8).map(m => `<div>${btn(`data-act="givePill" data-i="${m.realm}" data-m="${m.id}"`, `「${esc(m.alias)}」에게 ${PILL_NAME[m.realm]} 복용`, !(P[m.realm] > 0) || me.counts[m.realm] < 1)}</div>`).join('');
  return `<div class="panel"><h3>💊 영단 창고</h3><div class="dim">돈이 쌓이면 영단을 사서 문파의 가장 강한 무인에게 먹여 한 단계 끌어올릴 수 있어요. 현경 이상 고수는 아래에서 직접 골라 복용시킬 수 있고, 복용할 때마다 체력·내공·공격력이 12%씩 오릅니다.</div>
    <table><tr><th>영단</th><th>가격</th><th>보유</th><th style="text-align:left">행동</th></tr>${rows}</table></div>
    <div class="panel"><h3>👑 ${me.name} 고수 명부 (현경 이상)</h3><table><tr><th>별호 · 이름</th><th>체력</th><th>내공</th><th>공격력</th></tr>${mr}</table>${pick ? `<div style="margin-top:8px"><b>고수에게 직접 영단 복용</b>${pick}</div>` : ''}</div>`;
}
function hallOfMasters(W) {
  const all = []; for (const n in W.sects) { const s = W.sects[n]; if (!s.defeated) (s.masters || []).forEach(m => all.push([s, m, masterStats(m, s)])); }
  all.sort((a, b) => b[1].realm - a[1].realm || b[2].atk - a[2].atk);
  const rows = all.map(([s, m]) => mrow(m, s, `<td style="color:${s.color}">${s.name}</td>`)).join('') || '<tr><td colspan="5" class="dim">아직 현경에 오른 고수가 없습니다</td></tr>';
  return `<div class="panel"><h3>👑 천하 고수 명부 (현경 이상 · 별호)</h3><table><tr><th>별호 · 이름</th><th style="text-align:left">문파</th><th>체력</th><th>내공</th><th>공격력</th></tr>${rows}</table></div>`;
}
boot();
</script>
</body>
