<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강호대전: 천하쟁패 — 삼대 핵심 거점</title>
<style>
  :root { --bg:#14110f; --panel:#221c18; --line:#4a3a2c; --gold:#d9b46c; --text:#eadfce; --dim:#9a8b78; --red:#c0503c; --green:#6fae6a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  h1,h2,h3 { color:var(--gold); margin:0 0 10px; }
  #app { max-width:1020px; margin:0 auto; padding:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .card { background:#2b231d; border:1px solid var(--line); border-radius:8px; padding:10px; cursor:pointer; }
  .card:hover { border-color:var(--gold); }
  .card.mine { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .card.taken { opacity:.55; cursor:not-allowed; }
  .card b { color:var(--gold); font-size:17px; }
  .dim { color:var(--dim); font-size:13px; }
  .red { color:var(--red); } .green { color:var(--green); } .gold { color:var(--gold); }
  button { background:var(--gold); color:#2a1d0c; border:0; border-radius:6px; padding:7px 12px; font-weight:700; cursor:pointer; margin:2px; }
  button.sub { background:#3a2f26; color:var(--text); border:1px solid var(--line); }
  button.on { outline:2px solid var(--gold); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child,td:first-child { text-align:left; }
  .bar { height:10px; background:#3a2f26; border-radius:5px; overflow:hidden; }
  .bar > div { height:100%; background:var(--gold); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#3a2f26; margin-left:6px; }
  .tag.ai { color:var(--dim); } .tag.me { color:#2a1d0c; background:var(--gold); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .log div { font-size:13px; padding:2px 0; border-bottom:1px dashed #3a2f26; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#000c; border:1px solid var(--gold); padding:8px 16px; border-radius:20px; }
  svg text { font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  .map-legend{display:flex;gap:14px;flex-wrap:wrap;color:#c5b58f;font-size:12px;margin-top:8px}
  .map-frame{background:linear-gradient(135deg,#26352e,#171d1c);border:1px solid #806b45;border-radius:14px;padding:8px;box-shadow:0 10px 28px #0005}
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .objective {display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:linear-gradient(110deg,#34291b,#1d211e);border:1px solid #9a7843;border-radius:9px;padding:9px 12px;margin-bottom:10px}
  .core-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;margin:2px;border:1px solid #8d7147;border-radius:14px;background:#30271d;font-size:12px}
  .core-pill.dead{opacity:.45;text-decoration:line-through;border-color:#77463d}
  .map-frame{background:radial-gradient(ellipse at 50% 42%,#4a4633 0%,#252c26 52%,#151b19 100%);border:1px solid #a88a52;border-radius:14px;padding:8px;box-shadow:0 14px 40px #0009,inset 0 0 0 2px #d4b77a22}
  button.sub.danger{border-color:#8d493e;color:#e9b3a5}
  @media (max-width:760px){ .two { grid-template-columns:1fr; } }

const appEl = document.getElementById('app');
let Playroom;
{
  const pick = m => [m, m && m.default, m && m.Playroom].find(x => x && typeof x.insertCoin === 'function');
  const sources = [
    'https://esm.sh/playroomkit',
    'https://cdn.jsdelivr.net/npm/playroomkit/+esm',
    'https://esm.run/playroomkit',
    'https://cdn.skypack.dev/playroomkit',
    'https://unpkg.com/playroomkit?module',
  ];
  const errors = [];
  for (const url of sources) {
    try {
      const found = pick(await import(url));
      if (found) { Playroom = found; break; }
      errors.push(url + ' → insertCoin 없음');
    } catch (e) { errors.push(url + ' → ' + String(e && e.message || e)); }
  }
  if (!Playroom) {
    for (const url of ['https://cdn.jsdelivr.net/npm/playroomkit/multiplayer.umd.js', 'https://unpkg.com/playroomkit/multiplayer.umd.js']) {
      try {
        await new Promise((ok, no) => { const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = () => no(new Error('불러오기 실패')); document.head.appendChild(s); });
        const found = pick(window.Playroom) || pick(window.PlayroomKit);
        if (found) { Playroom = found; break; }
        errors.push(url + ' → insertCoin 없음');
      } catch (e) { errors.push(url + ' → ' + String(e && e.message || e)); }
    }
  }
  if (!Playroom) {
    appEl.innerHTML = '<div class="panel">라이브러리 로드 실패<br><span class="dim">' + errors.map(s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>') +
      '<br><br>광고차단/VPN/보안 프로그램을 끄거나 다른 브라우저로 시도해 주세요. 주소: ' + location.href + '</span></div>';
    throw new Error('Playroom load failed');
  }
  window.Playroom = Playroom;
}
window.addEventListener('error', ev => {
  appEl.innerHTML = '<div class="panel">오류: ' + String(ev.message) + '</div>';
});
window.addEventListener('unhandledrejection', ev => {

const NODE_ICON = { sect:'🏯', stronghold:'🛕', mine:'⛏️', herb:'🌿', city:'🏙️', house:'🏰' };

const ADJ = {};

for (const sect in CORE_SITES) for (const [id] of CORE_SITES[sect]) {

let ONLINE = null;   // 지금 접속 중인 플레이어 id 모음 (접속 안 한 문파는 방어 보너스)

const sum = a => a.reduce((x, y) => x + y, 0);
const clone = o => JSON.parse(JSON.stringify(o));
const rnd = Math.random;

function logPush(W, text, k) { W.log.push({ d: W.d, t: text, k: k || 'sys' }); if (W.log.length > 60) W.log.shift(); }
function orgTotal(s) { return sum(ORG_NAMES.map(n => s.orgs[n] || 0)); }
function avail(s) { const c = s.counts.slice(); c[0] = Math.max(0, c[0] - orgTotal(s)); return c; }
function power(c) { let p = 0; for (let i = 0; i < c.length; i++) p += c[i] * POWER[i]; return p; }
// 초월급 기인은 일반 무인과 별도로 전투력에 반영된다.
function prodigyPower(s) { return s && s.prodigy && !s.prodigy.away ? POWER[s.prodigy.realm] * 80 : 0; }
function sectPower(s, counts) { return power(counts || s.counts) + prodigyPower(s); }
function fixOrgs(s) {
  const max = Math.floor(s.counts[0] * 0.8), t = orgTotal(s);
  if (t > max) { const f = max / t; for (const n of ORG_NAMES) s.orgs[n] = Math.floor((s.orgs[n] || 0) * f); }
}
function atkMult(s) {
  let a = 0; SECTS[s.name].arts.forEach((art, i) => { a += KIND[art.k][0] * s.arts[i]; });
  return (1 + a) * WEAPONS[s.weapon].atk * ((SECTS[s.name].traits && SECTS[s.name].traits.stats.atk) || 1);
}
function defMult(s) {
  let d = 0; SECTS[s.name].arts.forEach((art, i) => { d += KIND[art.k][1] * s.arts[i]; });
  d += WEAPONS[s.weapon].def + Math.min(0.3, (s.orgs['호위대'] || 0) * 0.002);
  return (1 + d) * ((SECTS[s.name].traits && SECTS[s.name].traits.stats.def) || 1);
}
function artCost(s, i) { return Math.ceil(150 * Math.pow(s.arts[i] + 1, 2) * (1 - Math.min(0.5, (s.orgs['장서각'] || 0) / 200)) * ((SECTS[s.name].traits && SECTS[s.name].traits.stats.artCost) || 1)); }
function visible(id, day) { const a = NODES[id].appear; return !a || day >= a; }
function ownedNodes(W, name) { return Object.keys(W.nodes).filter(id => W.nodes[id].owner === name); }
function guardOf(id, day) { return NODES[id].guard * (1 + 0.02 * day); }
function isOffline(s) { return s.owner !== 'AI' && ONLINE !== null && !ONLINE.has(s.owner); }
function incomeOf(W, s) {

function defPowerOf(W, id, day) {

function makeWorld(picks) {   // picks = { 문파이름: {id, name} }

}

function makeUnits(s, mode) {
  const av = avail(s), u = REALMS.map(() => 0);

    else if (mode === 'elite') f = i >= 3 ? 1 : 0;
    else f = 0.7;
    u[i] = Math.floor(av[i] * f);
  }

}

function launch(W, name, to, mode) {

  const specialPower = mode !== 'mass' && s.prodigy && !s.prodigy.away ? POWER[s.prodigy.realm] * 80 : 0;
  if (power(units) + specialPower <= 0) return false;
  for (let i = 0; i < 9; i++) s.counts[i] -= units[i];
  if (specialPower) s.prodigy.away = true;
  fixOrgs(s);

  W.marches.push({ id: W.nextId, sect: name, from, to, units, specialPower, start: W.elapsed, arriveAt: W.elapsed + Math.round(DAY_SECONDS * 0.25) });
  logPush(W, `🚩 [${name}] ${to}(으)로 출진 (병력 ${sum(units).toLocaleString()}명)`, 'war');

}

function lossFracs(L) { return REALMS.map((_, i) => Math.min(0.97, Math.max(0, L * (1.2 - 0.1 * i)))); }

function reincarnate(W, pid, pname, byName) {

}

function checkAbsorb(W, defName, attName) {

  const total = sum(s.counts);

  for (let i = 0; i < 9; i++) att.counts[i] += Math.floor(s.counts[i] * 0.5);
  att.gold += Math.floor(s.gold * 0.5);
  att.peak = Math.max(att.peak, sum(att.counts));
  for (const id in W.nodes) if (W.nodes[id].owner === defName) W.nodes[id].owner = attName;

  s.counts = REALMS.map(() => 0); s.gold = 0; s.defeated = true;

  if (oldOwner !== 'AI') reincarnate(W, oldOwner, oldName, attName);

function destroyCoreSite(W, defName, attName, siteId) {
  const site = W.nodes[siteId], def = W.sects[defName], att = W.sects[attName];

  site.destroyed = true; site.owner = null; site.siege = null; site.garrison = REALMS.map(() => 0); site.fortLevel = 0;

function resolveMarch(W, m) {

  const to = m.to, node = W.nodes[to];

    }

  if (win) {
    if (core) {
      const siege = node.siege && node.siege.sect === att.name ? node.siege : { sect: att.name, progress: 0 };
      siege.progress = Math.min(3, siege.progress + 1); node.siege = siege;
      if (siege.progress >= 3) destroyCoreSite(W, NODES[to].sect, att.name, to);
      else logPush(W, `⚔️ [${att.name}] ${to} 공략 성공! 핵심 거점 파괴 진척 ${siege.progress}/3 ${stat}`, 'war');
    } else if (!hq) {
      const siege = node.siege && node.siege.sect === att.name ? node.siege : { sect: att.name, progress: 0 };
      siege.progress = Math.min(3, siege.progress + 1);
      node.siege = siege;
      if (siege.progress >= 3) {
        node.owner = att.name; node.garrison = REALMS.map(() => 0); node.siege = null;
        logPush(W, `🏴 [${att.name}] ${to} 최종 점령! 세 차례의 공방 끝에 영토를 확보했다 ${stat}`, 'war');
      } else {
        logPush(W, `⚔️ [${att.name}] ${to} 전투 승리! 포위 진척 ${siege.progress}/3 — 아직 점령하지 못했다 ${stat}`, 'war');
      }
    } else {
      logPush(W, `⚔️ [${att.name}]이(가) [${to}] 본산을 격파했다 ${stat}`, 'war');
      let chance = a > 0.67 ? 0.6 : 0.3;

      if (node.siege.progress === 0) node.siege = null;

}

function assassinate(W, name, targetName) {
  const s = W.sects[name], t = W.sects[targetName];
  if (!s || !t || t.defeated || targetName === name || t.leaderDead) return;
  if ((s.orgs['암살대'] || 0) < 5 || W.d <= s.lastAssDay) return;
  const p = assassinChance(s, t);
  s.lastAssDay = W.d;
  if (rnd() < p) {
    t.leaderDead = true; t.leaderDeadDay = W.d;
    for (let i = 0; i < 9; i++) t.counts[i] -= Math.floor(t.counts[i] * 0.03);
    fixOrgs(t);
    logPush(W, `🗡️ [${name}] 암살대가 [${targetName}] 장문인 암살에 성공했다!`, 'war');
    checkAbsorb(W, targetName, name);
  } else {
    const lost = Math.ceil((s.orgs['암살대'] || 0) * 0.6);
    s.orgs['암살대'] -= lost; s.counts[0] = Math.max(0, s.counts[0] - lost);
    logPush(W, `🗡️ [${name}] 암살대가 [${targetName}] 암살에 실패하고 ${lost}명을 잃었다`, 'war');
  }
}

function pickTarget(W, name) {
  const mine = ownedNodes(W, name); let best = null;
  for (const id in NODES) {
    if (!visible(id, W.d) || W.nodes[id].owner === name || W.nodes[id].destroyed) continue;
    if (!ADJ[id].some(a => mine.includes(a))) continue;
    const p = defPowerOf(W, id, W.d);
    if (!best || p < best.power) best = { id, power: p };
  }
  return best;
}

function applyCmd(W, pid, c) {
  const name = Object.keys(W.sects).find(n => W.sects[n].owner === pid && !W.sects[n].defeated);
  if (!name) return;
  const s = W.sects[name];
  switch (c.t) {
    case 'recruit': {
      const n = Math.min([100, 500].includes(c.n) ? c.n : 0, Math.floor(s.gold));
      s.gold -= n; s.counts[0] += n; break;
    }
    case 'train': {
      const i = Number(c.i), want = Number(c.n);
      if (!(i >= 0 && i <= 7) || ![1, 5, 20].includes(want)) break;
      const real = Math.min(want, s.counts[i], Math.floor(s.gold / TRAIN_COST[i]));
      if (real <= 0) break;
      s.gold -= real * TRAIN_COST[i]; s.counts[i] -= real; s.counts[i + 1] += real;
      if (i + 1 >= 4) logPush(W, `📈 [${name}]에서 ${real}명이 ${REALMS[i + 1]}에 올랐다`, 'sys');
      break;
    }
    case 'org': {
      if (!ORG_NAMES.includes(c.o) || ![-10, -1, 1, 10].includes(c.d)) break;
      const max = Math.floor(s.counts[0] * 0.8), cur = s.orgs[c.o] || 0, others = orgTotal(s) - cur;
      s.orgs[c.o] = Math.max(0, Math.min(cur + c.d, max - others)); break;
    }
    case 'art': {
      const i = Number(c.i);
      if (!(i >= 0 && i <= 2) || s.arts[i] >= MAX_ART) break;
      const cost = artCost(s, i);
      if (s.gold < cost) break;
      s.gold -= cost; s.arts[i]++;
      logPush(W, `📜 [${name}] ${SECTS[name].arts[i].n} ${s.arts[i]}성 달성`, 'sys'); break;
    }
    case 'weapon': {
      const nw = WEAPONS[s.weapon + 1];
      if (!nw || s.gold < nw.cost) break;
      s.gold -= nw.cost; s.weapon++;
      logPush(W, `🗡️ [${name}] 무기고가 ${nw.g} 등급 「${nw.n}」(으)로 강화되었다`, 'sys'); break;
    }
    case 'march': {
      if (!['mass', 'elite', 'all'].includes(c.mode)) break;
      launch(W, name, c.to, c.mode); break;
    }
    case 'fort': {
      const n = W.nodes[c.to], level = n && (n.fortLevel || 0), cost = 900 * (level + 1) * (level + 1);
      if (!n || n.owner !== name || n.destroyed || level >= 3 || s.gold < cost) break;
      s.gold -= cost; n.fortLevel = level + 1;
      logPush(W, `🧱 [${name}] ${c.to}에 방어 거점 ${n.fortLevel}단계를 건설했다`, 'sys'); break;
    }
    case 'garrison': {
      const n = W.nodes[c.to], i = Number(c.i), amount = Number(c.n);
      if (!n || n.owner !== name || n.destroyed || !(i >= 0 && i <= 8) || ![1,10,100].includes(amount) || s.counts[i] < amount) break;
      s.counts[i] -= amount; n.garrison = n.garrison || REALMS.map(() => 0); n.garrison[i] = (n.garrison[i] || 0) + amount;
      logPush(W, `🛡️ [${name}] ${c.to}에 ${REALMS[i]} ${amount}명을 배치했다`, 'sys'); break;
    }
    case 'withdraw': {
      const n = W.nodes[c.to], i = Number(c.i), amount = Number(c.n);
      if (!n || n.owner !== name || !(i >= 0 && i <= 8) || ![1,10,100].includes(amount) || (n.garrison?.[i] || 0) < amount) break;
      n.garrison[i] -= amount; s.counts[i] += amount; break;
    }
    case 'kill': assassinate(W, name, c.target); break;
  }
}

function aiAct(W, name) {
  const s = W.sects[name];
  if (s.defeated || s.owner !== 'AI') return;
  // AI는 매일 전쟁보다 내정·방비를 우선한다.
  let budget = Math.floor(s.gold * 0.45);
  for (const i of [3, 2, 4, 1, 0]) {
    const cost = TRAIN_COST[i], n = Math.min(6, s.counts[i], Math.floor(budget / cost));
    if (n > 0) { s.counts[i] -= n; s.counts[i + 1] += n; s.gold -= n * cost; budget -= n * cost; }
  }
  const rec = Math.min(180, Math.floor(budget * 0.35));
  if (rec > 0) { s.counts[0] += rec; s.gold -= rec; }
  const nw = WEAPONS[s.weapon + 1];
  if (nw && s.gold >= nw.cost * 1.8 && rnd() < 0.35) { s.gold -= nw.cost; s.weapon++; }
  if (rnd() < 0.35) {
    const ai = Math.floor(rnd() * 3);
    if (s.arts[ai] < MAX_ART) { const cost = artCost(s, ai); if (s.gold >= cost * 1.5) { s.gold -= cost; s.arts[ai]++; } }
  }
  const coreIds = CORE_SITE_IDS[name].filter(id => !W.nodes[id].destroyed);
  // 본산 주변 방어 거점을 우선 강화한다.
  if (coreIds.length && rnd() < 0.42) {
    const target = coreIds.slice().sort((a,b) => (W.nodes[a].fortLevel||0) - (W.nodes[b].fortLevel||0))[0];
    const level = W.nodes[target].fortLevel || 0, cost = 900 * (level + 1) * (level + 1);
    if (level < 3 && s.gold >= cost) { s.gold -= cost; W.nodes[target].fortLevel = level + 1; }
  }
  // 전선이 위협받으면 병력을 보내 주둔시킨다.
  const threatened = coreIds.find(id => W.nodes[id].siege && W.nodes[id].siege.progress > 0);
  if (threatened && s.counts[0] >= 100 && rnd() < 0.7) {
    const n = Math.min(100, s.counts[0]); s.counts[0] -= n; W.nodes[threatened].garrison[0] = (W.nodes[threatened].garrison[0] || 0) + n;
  }
  // AI의 공격 결정은 드물고, 전력 우위가 확실할 때만 실행한다.
  if (W.marches.filter(m => m.sect === name).length < 1 && rnd() < 0.045) {
    const t = pickTarget(W, name);
    const coreUnderThreat = coreIds.some(id => W.nodes[id].siege && W.nodes[id].siege.progress > 0);
    if (!coreUnderThreat && t && (power(makeUnits(s, 'all')) + prodigyPower(s)) * atkMult(s) >= t.power * 1.9) launch(W, name, t.id, 'all');
  }
}
function dailyUpdate(W, day) {
  W.d = day;
  const herbBy = {};
  for (const id in W.nodes) if (NODES[id].type === 'herb' && W.nodes[id].owner) herbBy[W.nodes[id].owner] = (herbBy[W.nodes[id].owner] || 0) + 1;
  for (const name in W.sects) {
    const s = W.sects[name];
    if (s.defeated) continue;
    s.gold += incomeOf(W, s);
    if (s.leaderDead && day - s.leaderDeadDay >= 3) { s.leaderDead = false; logPush(W, `👑 [${name}] 새 장문인을 추대했다`, 'sys'); }
    if (s.prodigy && s.prodigy.realm < 8 && rnd() < 0.5) {
      s.prodigy.realm++;
      logPush(W, `🌠 [${name}]의 천외기인 「${s.prodigy.name}」이(가) 기연을 깨우쳐 ${REALMS[s.prodigy.realm]}에 도달했다!`, 'war');
    }
    const mult = (s.leaderDead ? 0.5 : 1) * (SECTS[name].talent || 1) * ((SECTS[name].traits && SECTS[name].traits.stats.promote) || 1) * (1 + Math.min(0.5, (s.orgs['제자단'] || 0) / 200) + 0.05 * (herbBy[name] || 0));
    for (let i = 7; i >= 0; i--) {
      const exact = s.counts[i] * PROMOTE[i] * mult;
      let n = Math.floor(exact);
      if (rnd() < exact - n) n++;
      n = Math.min(n, s.counts[i]);
      s.counts[i] -= n; s.counts[i + 1] += n;
      if (n > 0 && i + 1 >= 5) logPush(W, `🌟 [${name}]에서 ${n}명이 ${REALMS[i + 1]}에 올랐다`, 'sys');
    }
    s.counts[0] += Math.max(1, Math.round(SECTS[name].base[0] * 0.01 * ((SECTS[name].traits && SECTS[name].traits.stats.recruit) || 1)));
    fixOrgs(s);
    s.peak = Math.max(s.peak, sum(s.counts));
  }
  if (day === 10) logPush(W, '🏰 강호에 오대세가가 모습을 드러냈다!', 'sys');
  for (const name in W.sects) aiAct(W, name);
}

function checkEnd(W) {
  const alive = Object.keys(W.sects).filter(n => !W.sects[n].defeated);
  if (alive.length === 1) {
    const w = W.sects[alive[0]];
    W.winner = { owner: w.owner, ownerName: w.ownerName, sects: alive };
  }
}
/*LOGIC_END*/

   화면 / 네트워크

let players = [];
const ui = { tab: 'map', node: null, toast: '', toastAt: 0 };
let lastTick = null, cmdCounter = 0, lastHtml = '';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = n => Math.round(n).toLocaleString();
const get = k => Playroom.getState(k);

function toast(t) { ui.toast = t; ui.toastAt = Date.now(); }

async function boot() {
  try {
    await Playroom.insertCoin({
      maxPlayersPerRoom: MAX_PLAYERS,
      defaultPlayerStates: { sect: '' },
    });
  } catch (e) {
    $root.innerHTML = '<div class="panel">접속 실패: ' + esc(e.message || e) + '</div>';
    return;
  }
  window.__ready = true;
  Playroom.onPlayerJoin(player => {
    players.push(player);
    player.onQuit(() => { players = players.filter(p => p !== player); });
  });
  if (Playroom.isHost()) {
    if (!get('phase')) Playroom.setState('phase', 'select', true);
    if (!get('speed')) Playroom.setState('speed', 1, true);
    if (get('elapsed') == null) Playroom.setState('elapsed', 0, true);
  }
  setInterval(render, 500);
  setInterval(hostTick, 1000);
  render();
}
const $root = appEl;

/* ---------- 방장: 시간 + 명령 처리 + 일일 갱신 ---------- */
function loadWorld() {
  const sects = get('sects'), nodes = get('nodes');
  if (!sects || !nodes) return null;
  return { sects: clone(sects), nodes: clone(nodes), marches: clone(get('marches') || []), log: clone(get('log') || []),
           colors: get('colors') || {}, nextId: get('nextId') || 0, elapsed: 0, d: 1 };
}

function hostTick() {
  if (!Playroom.isHost() || get('phase') !== 'play') { lastTick = null; return; }
  const now = Date.now();
  if (lastTick === null) { lastTick = now; return; }
  const dt = Math.min(300, (now - lastTick) / 1000); lastTick = now;
  const elapsed = (get('elapsed') || 0) + dt * (get('speed') || 1);
  Playroom.setState('elapsed', elapsed, true);

  const W = loadWorld(); if (!W) return;
  ONLINE = new Set(players.map(p => p.id));
  W.elapsed = elapsed; W.d = Math.floor(elapsed / DAY_SECONDS) + 1;
  const before = JSON.stringify([W.sects, W.nodes, W.marches, W.log, W.nextId]);

  // 1) 플레이어 명령
  const proc = clone(get('proc') || {}); let procChanged = false;
  for (const p of players) {
    const q = p.getState('cmds') || [], last = proc[p.id] || 0;
    for (const c of q) {
      if (c.n > (proc[p.id] || 0)) { applyCmd(W, p.id, c); proc[p.id] = c.n; procChanged = true; }
    }
  }
  if (procChanged) Playroom.setState('proc', proc, true);

  // 2) 도착한 병력 전투
  const due = W.marches.filter(m => m.arriveAt <= elapsed);
  W.marches = W.marches.filter(m => m.arriveAt > elapsed);
  for (const m of due) resolveMarch(W, m);

  // 3) 하루가 지났으면 일일 갱신
  const realDay = W.d;
  let done = get('processedDay') || 1; const startDone = done;
  while (done < realDay) { done++; dailyUpdate(W, done); }
  W.d = realDay;
  if (done !== startDone) Playroom.setState('processedDay', done, true);

  checkEnd(W);

  if (JSON.stringify([W.sects, W.nodes, W.marches, W.log, W.nextId]) !== before) {
    Playroom.setState('sects', W.sects, true);
    Playroom.setState('nodes', W.nodes, true);
    Playroom.setState('marches', W.marches, true);
    Playroom.setState('log', W.log, true);
    Playroom.setState('nextId', W.nextId, true);
  }
  if (W.winner) { Playroom.setState('winner', W.winner, true); Playroom.setState('phase', 'end', true); }
}

/* ---------- 행동 ---------- */
function pickSect(name) {
  const takenBy = players.find(p => p.getState('sect') === name);
  if (takenBy && takenBy.id !== Playroom.myPlayer().id) return;
  Playroom.myPlayer().setState('sect', name, true);
}

function startGame() {
  if (!Playroom.isHost()) return;
  const picks = {};
  for (const name in SECTS) {
    const o = players.find(p => p.getState('sect') === name);
    if (o) picks[name] = { id: o.id, name: o.getProfile().name };
  }
  const W = makeWorld(picks);
  logPush(W, '🔥 천하쟁패가 시작되었다! 각 문파의 본산과 핵심 거점 2곳, 총 3곳을 모두 파괴해야 멸문한다.', 'sys');
  const proc = {};
  for (const p of players) { const q = p.getState('cmds') || []; proc[p.id] = q.length ? q[q.length - 1].n : 0; }
  Playroom.setState('proc', proc, true);
  Playroom.setState('sects', W.sects, true);
  Playroom.setState('nodes', W.nodes, true);
  Playroom.setState('marches', [], true);
  Playroom.setState('log', W.log, true);
  Playroom.setState('colors', W.colors, true);
  Playroom.setState('nextId', 0, true);
  Playroom.setState('processedDay', 1, true);
  Playroom.setState('elapsed', 0, true);
  Playroom.setState('winner', null, true);
  Playroom.setState('phase', 'play', true);
}

function send(c) {
  const me = Playroom.myPlayer();
  const q = (me.getState('cmds') || []).slice(-14);
  q.push(Object.assign({}, c, { n: Date.now() * 100 + (cmdCounter++ % 100) }));
  me.setState('cmds', q, true);
  toast('명령을 보냈어요');
}

$root.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    case 'tab': ui.tab = d.tab; break;
    case 'node': ui.node = d.id; break;
    case 'pick': pickSect(d.name); break;
    case 'start': startGame(); break;
    case 'speed': if (Playroom.isHost()) Playroom.setState('speed', Number(d.v), true); break;
    case 'recruit': send({ t: 'recruit', n: Number(d.n) }); break;
    case 'train': send({ t: 'train', i: Number(d.i), n: Number(d.n) }); break;
    case 'org': send({ t: 'org', o: d.o, d: Number(d.d) }); break;
    case 'art': send({ t: 'art', i: Number(d.i) }); break;
    case 'weapon': send({ t: 'weapon' }); break;
    case 'march': send({ t: 'march', to: d.to, mode: d.mode }); break;
    case 'fort': send({ t: 'fort', to: d.to }); break;
    case 'garrison': send({ t: 'garrison', to: d.to, i: Number(d.i), n: Number(d.n) }); break;
    case 'withdraw': send({ t: 'withdraw', to: d.to, i: Number(d.i), n: Number(d.n) }); break;
    case 'kill': send({ t: 'kill', target: d.target }); break;
  }
  render();
});

/* ---------- 화면 그리기 ---------- */

  ONLINE = new Set(players.map(p => p.id));

  try { html = phase === 'play' ? renderPlay() : phase === 'end' ? renderEnd() : renderSelect(); }
  catch (e) { html = '<div class="panel">화면 오류: ' + esc(e.message) + '</div>'; }
  if (ui.toast && Date.now() - ui.toastAt < 2000) html += `<div class="toast">${esc(ui.toast)}</div>`;
  if (html !== lastHtml) { $root.innerHTML = html; lastHtml = html; }
}

        : '<span class="dim">방장이 게임을 시작할 때까지 기다려 주세요</span>'}</div></div>`;

function readWorld() {

function fuzz(v, key) {

  const x = v * (0.75 + (h % 50) / 100);

const btn = (attrs, label, dis) => `<button class="sub" ${attrs} ${dis ? 'disabled' : ''}>${label}</button>`;

function renderPlay() {

  const me = mySect(W), speed = get('speed') || 1, host = Playroom.isHost();
  const inDay = W.elapsed % DAY_SECONDS, left = DAY_SECONDS - inDay;
  const tleft = String(Math.floor(left / 60)).padStart(2, '0') + ':' + String(Math.floor(left % 60)).padStart(2, '0');
  const speedBtns = host ? `<div class="row"><span class="dim">시간 배속:</span>${[1, 4, 15, 60, 900].map(v => `<button class="sub ${speed === v ? 'on' : ''}" data-act="speed" data-v="${v}">×${v}</button>`).join('')}<span class="dim">(×1 = 하루 15분)</span></div>` : '';

  const head = `<div class="panel top">
    <div><h2 style="margin:0">⚔️ 강호대전</h2><div class="dim">${me ? `내 문파: <b class="gold">${me.name}</b>${me.leaderDead ? ' <span class="red">(문주 전사 — 새 문주 추대 중)</span>' : ''}` : '문파 없음 (관전 중)'}</div></div>

    <div style="min-width:220px"><b>${W.d}일차</b> <span class="dim">다음 날까지 ${tleft}</span><div class="bar"><div style="width:${(inDay / DAY_SECONDS) * 100}%"></div></div></div></div>
    ${speedBtns ? `<div class="panel">${speedBtns}</div>` : ''}`;

  const tabs = [['map', '🗺️ 강호 지도'], ['sect', '🏯 문파·육성'], ['org', '👥 조직'], ['arts', '📜 무공·무기'], ['world', '🌏 천하 형세']];
  const tabBar = `<div class="panel row">${tabs.map(([k, l]) => `<button class="sub ${ui.tab === k ? 'on' : ''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</div>`;

  let body = '';
  if (ui.tab === 'map') body = tabMap(W, me);
  else if (!me) body = '<div class="panel">문파가 없어서 관전만 할 수 있어요. 지도와 천하 형세 탭을 봐주세요.</div>';
  else if (ui.tab === 'sect') body = tabSect(W, me);
  else if (ui.tab === 'org') body = tabOrg(W, me);
  else if (ui.tab === 'arts') body = tabArts(W, me);
  if (ui.tab === 'world') body = tabWorld(W, me);

  const log = W.log.slice(-14).reverse().map(l => `<div>[${l.d}일] ${esc(l.t)}</div>`).join('');
  return head + tabBar + body + `<div class="panel log"><h3>📰 강호 소식</h3>${log || '<div class="dim">아직 소식이 없습니다</div>'}</div>`;
}

/* ----- 지도 ----- */
function tabMap(W, me) {
  const el = W.elapsed, day = W.d;
  const myNodes = me ? ownedNodes(W, me.name) : [];
  const attackable = new Set();
  if (me) for (const id in NODES) {
    if (!visible(id, day) || W.nodes[id].owner === me.name) continue;
    if (ADJ[id].some(a => myNodes.includes(a))) attackable.add(id);
  }
  let svg = `<svg viewBox="0 0 760 520" role="img" aria-label="강호의 고풍스러운 전략 지도" style="width:100%;background:#171d1c;border-radius:12px;border:1px solid #b69a61;box-shadow:0 16px 40px #000b">
    <defs>
      <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b4938"/><stop offset=".42" stop-color="#29362f"/><stop offset="1" stop-color="#171f1d"/></linearGradient>
      <radialGradient id="mist"><stop offset="0" stop-color="#d2b77c" stop-opacity=".2"/><stop offset="1" stop-color="#b6a078" stop-opacity="0"/></radialGradient>
      <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M0 9 Q8 4 16 9 T34 9 M-8 27 Q2 22 12 27 T32 27" fill="none" stroke="#d9c69a" stroke-opacity=".08" stroke-width="1"/></pattern>
      <linearGradient id="goldEdge"><stop stop-color="#6d5734"/><stop offset=".5" stop-color="#d9bd7d"/><stop offset="1" stop-color="#6d5734"/></linearGradient>
      <filter id="softGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    <rect x="5" y="5" width="750" height="510" rx="8" fill="url(#parchment)" stroke="url(#goldEdge)" stroke-width="3"/><rect x="12" y="12" width="736" height="496" rx="5" fill="none" stroke="#e0c88f" stroke-opacity=".28"/><rect width="760" height="520" fill="url(#grain)"/>
    <ellipse cx="365" cy="245" rx="330" ry="240" fill="url(#mist)"/>
    <g fill="none" stroke="#c3b68e" stroke-opacity=".2" stroke-width="1.2"><path d="M20 100 Q80 60 140 100 T260 92 T390 98 T530 70 T740 92 M18 120 Q80 80 140 120 T260 112 T390 118 T530 90 T740 112"/><path d="M15 390 Q95 335 170 380 T315 365 T470 390 T745 345 M15 410 Q95 355 170 400 T315 385 T470 410 T745 365"/><path d="M70 40 Q120 10 170 45 T280 35 T400 45 T540 25 T710 45 M65 470 Q130 430 210 465 T390 455 T570 470 T720 440"/></g>
    <path d="M45 270 Q125 220 205 252 T365 230 T535 250 T720 210" fill="none" stroke="#9cb7a8" stroke-opacity=".22" stroke-width="15"/><path d="M45 270 Q125 220 205 252 T365 230 T535 250 T720 210" fill="none" stroke="#4b7775" stroke-opacity=".8" stroke-width="5"/><path d="M45 270 Q125 220 205 252 T365 230 T535 250 T720 210" fill="none" stroke="#b6c7b2" stroke-opacity=".35" stroke-width="1.5"/>
    <g fill="#b8aa83" fill-opacity=".28" stroke="#d9c89f" stroke-opacity=".48" stroke-width="1.2"><path d="M60 170 l28 -52 22 31 26 -65 38 82 -24 19 -27 -25 -26 28z M250 120 l34 -55 30 40 27 -53 43 68 -28 17 -31 -20 -29 26z M500 145 l32 -52 29 35 26 -58 42 76 -30 17 -31 -24 -31 27z M95 430 l25 -45 29 34 26 -48 39 66 -25 14 -31 -19 -30 19z M500 430 l28 -48 28 34 26 -50 40 70 -28 13 -29 -20 -30 18z"/></g>
    <g transform="translate(700 76)" opacity=".8"><circle r="28" fill="none" stroke="#d5bd82" stroke-width="1.2"/><circle r="19" fill="none" stroke="#d5bd82" stroke-opacity=".6"/><path d="M0 -25 L5 -3 0 0 -5 -3z M0 25 L5 3 0 0 -5 3z M-25 0 L-3 -5 0 0 -3 5z M25 0 L3 -5 0 0 3 5z" fill="#d5bd82"/><text x="0" y="-35" text-anchor="middle" fill="#e5d4a9" font-size="9">北</text></g>
    <g fill="#b9aa83" fill-opacity=".22" stroke="#d2c29b" stroke-opacity=".28" stroke-width="1.5">
      <path d="M70 160 l30 -48 24 35 25 -60 34 73 -22 18 -25 -24 -25 26z"/>
      <path d="M270 120 l34 -55 30 40 27 -53 43 68 -28 17 -31 -20 -29 26z"/>
      <path d="M505 150 l32 -52 29 35 26 -58 42 76 -30 17 -31 -24 -31 27z"/>
      <path d="M110 425 l25 -45 29 34 26 -48 39 66 -25 14 -31 -19 -30 19z"/>
      <path d="M500 430 l28 -48 28 34 26 -50 40 70 -28 13 -29 -20 -30 18z"/>
    </g>
    <text x="28" y="32" fill="#d8c49a" font-size="13" letter-spacing="4">THE MARTIAL WORLD · 강호전도</text>
    <text x="735" y="500" text-anchor="end" fill="#c4b18a" opacity=".65" font-size="10">천하 산하도</text>`;
  for (const [a, b] of EDGES) {
    if (!visible(a, day) || !visible(b, day)) continue;
    svg += `<line x1="${NODES[a].x}" y1="${NODES[a].y}" x2="${NODES[b].x}" y2="${NODES[b].y}" stroke="#c1ad7e" stroke-opacity=".34" stroke-width="1.6" stroke-dasharray="3 5"/>`;
  }
  for (const m of W.marches) {
    const f = NODES[m.from], t = NODES[m.to], s = W.sects[m.sect];
    const pr = Math.min(1, Math.max(0, (el - m.start) / Math.max(1, m.arriveAt - m.start)));
    const x = f.x + (t.x - f.x) * pr, y = f.y + (t.y - f.y) * pr;
    svg += `<line x1="${f.x}" y1="${f.y}" x2="${t.x}" y2="${t.y}" stroke="${s.color}" stroke-width="3" stroke-dasharray="6 5"/>`;
    svg += `<circle cx="${x}" cy="${y}" r="7" fill="${s.color}" stroke="#fff" stroke-width="1.5"><title>${esc(m.sect)} 병력</title></circle>`;
  }
  for (const id in NODES) {
    if (!visible(id, day)) continue;
    const N = NODES[id], ns = W.nodes[id], own = ns.owner ? W.sects[ns.owner] : null;
    if (ns.destroyed) { svg += `<g opacity=".38"><circle cx="${N.x}" cy="${N.y}" r="10" fill="#171513" stroke="#9b5548" stroke-width="2"/><path d="M${N.x-6} ${N.y-6}l12 12m0 -12l-12 12" stroke="#b76a58" stroke-width="2"/><text x="${N.x}" y="${N.y+22}" text-anchor="middle" font-size="9" fill="#d6a18d">파괴됨</text></g>`; continue; }
    const color = own ? own.color : '#6b5c4b';
    const r = N.type === 'sect' ? 21 : (N.type === 'stronghold' ? 12 : 15), sel = ui.node === id;
    svg += `<g data-act="node" data-id="${id}" style="cursor:pointer">`;
    if (attackable.has(id)) svg += `<circle cx="${N.x}" cy="${N.y}" r="${r + 7}" fill="none" stroke="#d9b46c" stroke-width="2" stroke-dasharray="4 3"/>`;
    svg += `<circle cx="${N.x}" cy="${N.y}" r="${r+4}" fill="none" stroke="${color}" stroke-opacity=".55" stroke-width="1.5"/>`;
    if ((ns.fortLevel||0)>0) svg += `<circle cx="${N.x}" cy="${N.y}" r="${r+8}" fill="none" stroke="#d7b96f" stroke-width="${1+ns.fortLevel}" stroke-opacity=".75"/>`;
    svg += `<circle cx="${N.x}" cy="${N.y}" r="${r}" fill="${color}" stroke="${sel ? '#f3dfaa' : '#d0bd91'}" stroke-width="${sel ? 3 : 1.5}"/>`;
    svg += `<text x="${N.x}" y="${N.y + 5}" text-anchor="middle" font-size="${N.type === 'sect' ? 18 : (N.type === 'stronghold' ? 11 : 14)}">${NODE_ICON[N.type]}</text>`;
    const label = N.type === 'stronghold' ? N.siteName : id;
    svg += `<text x="${N.x}" y="${N.y + r + 12}" text-anchor="middle" font-size="${N.type === 'stronghold' ? 9 : 11}" fill="#f0dfb8" stroke="#17201d" stroke-width="2.5" paint-order="stroke">${esc(label)}</text></g>`;
  }
  svg += '</svg>';

  const info = ui.node ? nodeInfo(W, me, ui.node, attackable) : '<div class="dim">지도에서 지역을 눌러 보세요. 금색 점선 테두리는 출정 가능한 지역이에요. 일반 영토는 포위전 3단계를 채워야 점령할 수 있어요.</div>';
  const mine = me ? W.marches.filter(m => m.sect === me.name).map(m => `<div>🚩 ${m.to} 방면 행군 중 (도착까지 ${Math.max(0, Math.round(m.arriveAt - el))}초)</div>`).join('') : '';
  const objective = me ? `<div class="objective"><b class="gold">⚔️ 승리 조건</b><span>적 문파의 본산과 핵심 거점 2곳, 총 3곳을 각각 3차례 공략해 모두 파괴하세요.</span></div>` : '';
  return `${objective}<div class="panel"><div class="map-frame">${svg}</div><div class="map-legend"><span>◆ 문파 본산 (파괴 가능)</span><span>🛕 핵심 거점 (문파당 총 3곳)</span><span>◇ 자원 거점</span><span>━━ 행군로</span><span>금색 점선: 출정 가능</span><span>금색 외곽선: 방어 시설</span></div></div><div class="two"><div class="panel">${info}</div><div class="panel"><h3>내 출정 부대</h3>${mine || '<div class="dim">출정 중인 부대가 없어요 (최대 2개)</div>'}</div></div>`;
}

function nodeInfo(W, me, id, attackable) {
  const N = NODES[id], ns = W.nodes[id], own = ns.owner ? W.sects[ns.owner] : null;
  const scouts = me && (me.orgs['정찰대'] || 0) >= 10, ownMine = me && ns.owner === me.name;
  const def = defPowerOf(W, id, W.d);
  const siege = ns.siege;
  const defTxt = ownMine || scouts ? num(def) : fuzz(def, id + W.d);
  const hq = !!SECTS[id] && !W.sects[id].defeated, core = !!N.core;
  const garrison = ns.garrison || REALMS.map(() => 0), garrisonTotal = sum(garrison);
  let h = `<h3>${NODE_ICON[N.type]} ${id}</h3>
    <div class="dim">${NODE_LABEL[N.type]}${hq ? ' · ' + SECTS[id].desc : ''}</div>
    <div>소유: ${own ? `<b style="color:${own.color}">${own.name}</b> (${own.owner === 'AI' ? 'AI' : esc(own.ownerName)})` : '주인 없음'}</div>
    <div>하루 수입: 금 +${N.income}</div>
    <div>방어 전력: <b>${defTxt}</b>${!scouts && !ownMine ? ' <span class="dim">(정찰대 10명 이상이면 정확히 보임)</span>' : ''}</div>
    ${N.core ? `<div class="gold">핵심 거점 · 파괴 시 ${esc(N.sect)}의 3대 거점 중 1곳 제거</div>` : ''}
    ${ns.fortLevel ? `<div>방어 시설: <b class="gold">${ns.fortLevel}/3단계</b></div>` : ''}
    ${garrisonTotal ? `<div>주둔 병력: <b>${num(garrisonTotal)}명</b></div>` : ''}
    ${siege ? `<div class="gold">포위전: ${esc(siege.sect)} ${siege.progress}/3단계</div>` : ''}`;
  if (hq && own) {
    const strong = own.counts.map((c, i) => [REALMS[i], c]).slice(4).filter(x => x[1] > 0).map(x => `${x[0]} ${x[1]}명`).join(', ');
    h += `<div>강자: ${strong || '초절정 이상 없음'}</div>${own.leaderDead ? '<div class="red">장문인 전사 상태</div>' : ''}`;
    if (isOffline(own)) h += '<div class="dim">(접속 안 한 문파: 방어력 +30%)</div>';
  }
  if (me && ownMine && !ns.destroyed) {
    const level = ns.fortLevel || 0, fortCost = 900 * (level + 1) * (level + 1);
    h += `<div style="margin-top:10px;border-top:1px solid #4a3a2c;padding-top:8px"><b>🧱 방어 거점 건설 / 강화</b><div>${btn(`data-act="fort" data-to="${id}"`, level >= 3 ? '최대 강화' : `방어 시설 ${level+1}단계 건설 (${num(fortCost)}금)`, level >= 3 || me.gold < fortCost)} <span class="dim">최대 3단계 · 방어력 상승</span></div>`;
    h += `<div style="margin-top:8px"><b>🛡️ 병력 주둔 / 증원</b><div class="dim">보낼 병력의 경지별 인원만큼 본대에서 빠져 이 거점을 지킵니다.</div>`;
    const sendOptions = [[0,100,'삼류 100명'],[2,10,'일류 10명'],[3,1,'절정 1명'],[4,1,'초절정 1명'],[5,1,'화경 1명']];
    for (const [i,n,label] of sendOptions) h += btn(`data-act="garrison" data-to="${id}" data-i="${i}" data-n="${n}"`, label, me.counts[i] < n);
    const withdrawOptions = [[0,100,'삼류 100명 회수'],[2,10,'일류 10명 회수'],[3,1,'절정 1명 회수'],[4,1,'초절정 1명 회수'],[5,1,'화경 1명 회수']];
    for (const [i,n,label] of withdrawOptions) if ((garrison[i] || 0) >= n) h += btn(`data-act="withdraw" data-to="${id}" data-i="${i}" data-n="${n}"`, label);
    h += `</div></div>`;
  }
  if (me && attackable.has(id)) {
    const full = W.marches.filter(m => m.sect === me.name).length >= 2;
    const modes = [['mass', '대군 출진', '삼류~일류 80%'], ['elite', '정예 출진', '절정 이상 전원'], ['all', '전군 출진', '전체 70%']];
    h += '<div style="margin-top:8px"><b>출진</b></div>';
    for (const [m, label, desc] of modes) {
      const P = (power(makeUnits(me, m)) + (m !== 'mass' ? prodigyPower(me) : 0)) * atkMult(me);
      h += `<div>${btn(`data-act="march" data-to="${id}" data-mode="${m}"`, label, full || P <= 0)} <span class="dim">${desc} · 공격 전력 ${num(P)}</span></div>`;
    }
    if (full) h += '<div class="red">부대를 이미 2개 출정시켰어요</div>';
  } else if (me && ns.owner !== me.name) {
    h += '<div class="dim" style="margin-top:8px">내 영토와 맞닿아 있지 않아서 아직 공격할 수 없어요</div>';
  }
  return h;
}

/* ----- 문파·육성 ----- */
function tabSect(W, me) {
  const c = me.counts, total = sum(c), org = orgTotal(me);
  const away = sum(W.marches.filter(m => m.sect === me.name).map(m => sum(m.units)));
  const rows = REALMS.map((r, i) => {
    const train = i <= 7 ? [1, 5, 20].map(n => btn(`data-act="train" data-i="${i}" data-n="${n}"`, `${n}명`, me.gold < TRAIN_COST[i])).join('') + ` <span class="dim">1명당 ${num(TRAIN_COST[i])}금</span>` : '<span class="dim">최상위</span>';
    return `<tr><td>${r}</td><td>${num(c[i])}</td><td style="text-align:left">${i <= 7 ? '지도 → ' + REALMS[i + 1] : ''} ${train}</td></tr>`;
  }).reverse().join('');
  return `<div class="panel"><h3>🏯 ${me.name} 무인 현황</h3>
    <div class="dim">대규모로 키울지, 소수정예로 키울지는 문주의 선택이에요. 삼류를 늘리면 싸고 빠르지만 약하고, 높은 경지는 비싸고 느리지만 전투에서 훨씬 오래 살아남아요.</div>
    <div style="margin:8px 0">모집: ${btn('data-act="recruit" data-n="100"', '삼류 100명 (100금)', me.gold < 100)}${btn('data-act="recruit" data-n="500"', '삼류 500명 (500금)', me.gold < 500)}</div>
    <table><tr><th>경지</th><th>인원</th><th style="text-align:left">직접 지도(금으로 한 단계 승급)</th></tr>${rows}
    <tr><th>합계</th><th>${num(total)}</th><th style="text-align:left" class="dim">조직 배치 ${num(org)}명 · 출정 중 ${num(away)}명 포함 아님</th></tr></table>
    <div class="dim" style="margin-top:8px">⚙️ 하루마다 자연 승급이 판정돼요. 문파별 무인 자질 보정에 제자단·약초밭 효과가 추가 적용됩니다.</div>
    <div class="dim" style="margin-top:5px">문파 자질: ${SECTS[me.name].talentLabel || '일반 자질 보정 ×1.0'} · 문주 부재 시 승급 확률 50%</div>
    <div class="dim" style="margin-top:5px;line-height:1.9">삼류 → 이류 4% · 이류 → 일류 3% · 일류 → 절정 2% · 절정 → 초절정 0.8%<br>초절정 → 화경 0.3% · 화경 → 현경 0.07% · 현경 → 생사경 0.05% · 생사경 → 자연경 0.01%</div>
    ${me.prodigy ? `<div style="margin-top:10px;padding:10px;border:1px solid #b98b42;border-radius:8px;background:linear-gradient(120deg,#352a1a,#211b16)"><b class="gold">🌠 초월급 기인 — ${me.prodigy.name}</b><div>현재 경지: <b>${REALMS[me.prodigy.realm]}</b> · 매일 50% 확률로 한 단계 돌파 · 일반 무인보다 압도적인 전투력</div></div>` : ''}
    <div style="margin-top:8px">공격 배율 <b>×${atkMult(me).toFixed(2)}</b> · 방어 배율 <b>×${defMult(me).toFixed(2)}</b> · 전투력 합계 <b>${num(power(avail(me)))}</b></div></div>`;
}

/* ----- 조직 ----- */
function tabOrg(W, me) {
  const max = Math.floor(me.counts[0] * 0.8), used = orgTotal(me), scouts = (me.orgs['정찰대'] || 0) >= 10;
  const rows = ORGS.map(([n, d]) => `<tr><td>${n}<div class="dim">${d}</div></td><td>${num(me.orgs[n] || 0)}</td>
    <td style="text-align:left">${[-10, -1, 1, 10].map(x => btn(`data-act="org" data-o="${n}" data-d="${x}"`, (x > 0 ? '+' : '') + x)).join('')}</td></tr>`).join('');
  const ready = (me.orgs['암살대'] || 0) >= 5 && W.d > me.lastAssDay;
  const targets = Object.keys(W.sects).filter(n => n !== me.name && !W.sects[n].defeated && !W.sects[n].leaderDead).map(n => {
    const t = W.sects[n];
    return `<div>${btn(`data-act="kill" data-target="${n}"`, '암살 시도', !ready)} ${n} <span class="dim">(${t.owner === 'AI' ? 'AI' : esc(t.ownerName)}) 성공률 ${scouts ? Math.round(assassinChance(me, t) * 100) + '%' : '불명 (정찰대 필요)'}</span></div>`;
  }).join('');
  return `<div class="panel"><h3>👥 문파 조직</h3>
    <div class="dim">삼류 무인을 각 조직에 배치해요. 배치된 인원은 전투에 참가하지 않아요. (삼류의 80%까지 배치 가능) 배치 ${num(used)} / ${num(max)}</div>
    <table><tr><th>조직</th><th>인원</th><th style="text-align:left">조정</th></tr>${rows}</table></div>
    <div class="panel"><h3>🗡️ 암살 작전</h3>
    <div class="dim">암살대 5명 이상, 하루에 한 번. 성공하면 장문인이 전사해 그 문파가 크게 약해져요. 실패하면 암살대 60%를 잃어요. ${ready ? '' : '<span class="red">(지금은 불가능: 암살대 부족 또는 오늘 이미 시도)</span>'}</div>${targets || '<div class="dim">대상 없음</div>'}</div>`;
}

/* ----- 무공·무기 ----- */
function tabArts(W, me) {
  const arts = SECTS[me.name].arts.map((a, i) => {
    const lv = me.arts[i], cost = artCost(me, i), k = KIND[a.k];
    return `<tr><td><b>${a.n}</b><div class="dim">${a.k} · 한 성마다 공격 +${Math.round(k[0] * 100)}% / 방어 +${Math.round(k[1] * 100)}%</div></td>
      <td>${'★'.repeat(lv)}${'☆'.repeat(MAX_ART - lv)}</td>
      <td style="text-align:left">${lv >= MAX_ART ? '<span class="green">대성</span>' : btn(`data-act="art" data-i="${i}"`, `연구 (${num(cost)}금)`, me.gold < cost)}</td></tr>`;
  }).join('');
  const w = WEAPONS[me.weapon], nw = WEAPONS[me.weapon + 1];
  return `<div class="panel"><h3>📜 ${me.name} 고유 무공</h3>
    <div class="dim">다른 문파는 이 무공을 배울 수 없어요. 장서각 인원이 많으면 연구비가 줄어들어요.</div>
    <table><tr><th>무공</th><th>수련</th><th style="text-align:left">연구</th></tr>${arts}</table></div>
    <div class="panel"><h3>🗡️ 무기고</h3>
    <div>현재: <b class="gold">[${w.g}] ${w.n}</b> <span class="dim">공격 ×${w.atk} · 방어 +${Math.round(w.def * 100)}%</span></div>
    <div style="margin-top:6px">${nw ? btn('data-act="weapon"', `[${nw.g}] ${nw.n}(으)로 강화 (${num(nw.cost)}금)`, me.gold < nw.cost) + `<span class="dim"> 공격 ×${nw.atk} · 방어 +${Math.round(nw.def * 100)}%</span>` : '<span class="green">최고 등급입니다</span>'}</div></div>`;
}

/* ----- 천하 형세 ----- */
function tabWorld(W, me) {
  const scouts = me && (me.orgs['정찰대'] || 0) >= 10;
  const list = Object.keys(W.sects).map(n => W.sects[n]).filter(s => !s.defeated).map(s => {
    let top = 0; for (let i = 8; i >= 0; i--) if (s.counts[i] > 0) { top = i; break; }
    return { s, top, pw: power(s.counts) };
  }).sort((a, b) => b.top - a.top || b.pw - a.pw);
  const rows = list.map(({ s, top }) => {
    const mineRow = me && s.name === me.name, exact = mineRow || scouts;
    const strong = s.counts.map((c, i) => [REALMS[i], c]).slice(4).filter(x => x[1] > 0).map(x => `${x[0]} ${x[1]}`).join(' / ') || '-';
    const jeol = sum(s.counts.slice(3)), total = sum(s.counts);
    const cores = CORE_SITE_IDS[s.name].filter(id => !W.nodes[id].destroyed).length;
    const tag = s.owner === 'AI' ? '<span class="tag ai">AI</span>' : `<span class="tag ${mineRow ? 'me' : ''}">${esc(s.ownerName)}</span>`;
    return `<tr><td><span style="color:${s.color}">●</span> ${s.name}${tag}${s.prodigy ? ` <span class="gold">🌠 초월급 기인(${REALMS[s.prodigy.realm]})</span>` : ''}${s.leaderDead ? ' <span class="red">☠</span>' : ''}</td>
      <td>${REALMS[top]}</td><td style="text-align:left">${strong}</td>
      <td><b class="gold">${cores}/3</b></td><td>${exact ? num(jeol) : fuzz(jeol, s.name + 'j' + W.d)}</td><td>${exact ? num(total) : fuzz(total, s.name + 't' + W.d)}</td></tr>`;
  }).join('');
  const dead = Object.keys(W.sects).filter(n => W.sects[n].defeated).map(n => `${n}`).join(', ');
  return `<div class="panel"><h3>🌏 천하 형세 (강한 순)</h3>
    <div class="dim">각 문파는 본산 포함 핵심 거점 3곳을 보유합니다. 핵심 거점이 모두 파괴되면 해당 문파는 멸문합니다. 초절정 이상의 강자는 누구나 볼 수 있어요.</div>
    <table><tr><th>문파</th><th>최고 경지</th><th style="text-align:left">강자 (초절정 이상)</th><th>핵심 거점</th><th>절정 이상</th><th>전체</th></tr>${rows}</table>
    ${dead ? `<div class="dim" style="margin-top:8px">멸문: ${dead}</div>` : ''}</div>`;
}

boot();
</script>
</body>
</html>
