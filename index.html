<!DOCTYPE html>
<html lang="ko">
<head>

<title>강호대전: 천하쟁패 — 삼대 핵심 거점</title>
<style>
  :root { --bg:#14110f; --panel:#221c18; --line:#4a3a2c; --gold:#d9b46c; --text:#eadfce; --dim:#9a8b78; --red:#c0503c; --green:#6fae6a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  h1,h2,h3 { color:var(--gold); margin:0 0 10px; }
  #app { max-width:1420px; margin:0 auto; padding:14px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px; }
  .card { background:#2b231d; border:1px solid var(--line); border-radius:8px; padding:10px; cursor:pointer; }
  .card:hover { border-color:var(--gold); }
  .card.mine { border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .card.taken { opacity:.55; cursor:not-allowed; }
  .card b { color:var(--gold); font-size:17px; }
  .dim { color:var(--dim); font-size:13px; }
  .red { color:var(--red); } .green { color:var(--green); } .gold { color:var(--gold); }
  button { background:var(--gold); color:#2a1d0c; border:0; border-radius:6px; padding:7px 12px; font-weight:700; cursor:pointer; margin:2px; }
  button.sub { background:#3a2f26; color:var(--text); border:1px solid var(--line); }
  button.on { outline:2px solid var(--gold); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:right; }
  th:first-child,td:first-child { text-align:left; }
  .bar { height:10px; background:#3a2f26; border-radius:5px; overflow:hidden; }
  .bar > div { height:100%; background:var(--gold); }
  .tag { display:inline-block; font-size:11px; padding:1px 6px; border-radius:10px; background:#3a2f26; margin-left:6px; }
  .tag.ai { color:var(--dim); } .tag.me { color:#2a1d0c; background:var(--gold); }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .top { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .log div { font-size:13px; padding:2px 0; border-bottom:1px dashed #3a2f26; }
  .toast { position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:#000c; border:1px solid var(--gold); padding:8px 16px; border-radius:20px; }
  svg text { font-family:"Noto Sans KR","Malgun Gothic",sans-serif; }
  .map-legend{display:flex;gap:14px;flex-wrap:wrap;color:#c5b58f;font-size:12px;margin-top:8px}
  .map-frame{background:linear-gradient(135deg,#26352e,#171d1c);border:1px solid #806b45;border-radius:14px;padding:8px;box-shadow:0 10px 28px #0005}
  .two { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .objective {display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:linear-gradient(110deg,#34291b,#1d211e);border:1px solid #9a7843;border-radius:9px;padding:9px 12px;margin-bottom:10px}
  .core-pill{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;margin:2px;border:1px solid #8d7147;border-radius:14px;background:#30271d;font-size:12px}

  .map-frame{overflow-x:auto;background:radial-gradient(ellipse at 50% 42%,#4a4633 0%,#252c26 52%,#151b19 100%);border:1px solid #a88a52;border-radius:14px;padding:8px;box-shadow:0 14px 40px #0009,inset 0 0 0 2px #d4b77a22}

const appEl = document.getElementById('app');
let Playroom;
{
  const pick = m => [m, m && m.default, m && m.Playroom].find(x => x && typeof x.insertCoin === 'function');
  const sources = [
    'https://esm.sh/playroomkit',
    'https://cdn.jsdelivr.net/npm/playroomkit/+esm',
    'https://esm.run/playroomkit',
    'https://cdn.skypack.dev/playroomkit',
    'https://unpkg.com/playroomkit?module',
  ];
  const errors = [];
  for (const url of sources) {
    try {
      const found = pick(await import(url));
      if (found) { Playroom = found; break; }
      errors.push(url + ' → insertCoin 없음');
    } catch (e) { errors.push(url + ' → ' + String(e && e.message || e)); }
  }
  if (!Playroom) {
    for (const url of ['https://cdn.jsdelivr.net/npm/playroomkit/multiplayer.umd.js', 'https://unpkg.com/playroomkit/multiplayer.umd.js']) {
      try {
        await new Promise((ok, no) => { const s = document.createElement('script'); s.src = url; s.onload = ok; s.onerror = () => no(new Error('불러오기 실패')); document.head.appendChild(s); });
        const found = pick(window.Playroom) || pick(window.PlayroomKit);
        if (found) { Playroom = found; break; }
        errors.push(url + ' → insertCoin 없음');
      } catch (e) { errors.push(url + ' → ' + String(e && e.message || e)); }
    }
  }
  if (!Playroom) {
    appEl.innerHTML = '<div class="panel">라이브러리 로드 실패<br><span class="dim">' + errors.map(s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;')).join('<br>') +

    throw new Error('Playroom load failed');
  }
  window.Playroom = Playroom;
}
window.addEventListener('error', ev => {
  appEl.innerHTML = '<div class="panel">오류: ' + String(ev.message) + '</div>';
});
window.addEventListener('unhandledrejection', ev => {

  return Math.floor(inc * ((SECTS[s.name].traits && SECTS[s.name].traits.stats.income) || 1));
}
function defPowerOf(W, id, day) {
  const n = W.nodes[id], owner = n && n.owner, d = owner ? W.sects[owner] : null;
  const fort = (n.fortLevel || 0) * guardOf(id, day) * 0.55;
  const garrison = power(n.garrison || []);
  if (n.core || SECTS[id]) {
    const sect = W.sects[n.sect || id] || d;
    if (!sect) return guardOf(id, day) + fort + garrison;
    return sectPower(sect, avail(sect)) * defMult(sect) * 1.2 * (sect.leaderDead ? 0.85 : 1) * (isOffline(sect) ? 1.3 : 1) + fort + garrison;
  }
  const g = guardOf(id, day);
  if (d) return g + 0.15 * sectPower(d, avail(d)) * defMult(d) + fort + garrison;
  return g + fort + garrison;
}
function assassinChance(s, t) {
  const a = (s.orgs['암살대'] || 0) * 2 + 1;
  const d = (t.orgs['호위대'] || 0) * 2 + sum(t.counts.slice(3)) * 0.5 + 5;
  return Math.min(0.85, Math.max(0.05, a / (a + d)));
}

function makeWorld(picks) {   // picks = { 문파이름: {id, name} }
  const sects = {}, nodes = {}, colors = {}; let ci = 0;
  for (const name in SECTS) {
    const o = picks[name];
    if (o && !colors[o.id]) colors[o.id] = PALETTE[ci++ % PALETTE.length];
    const counts = SECTS[name].base.slice(), c0 = counts[0];
    sects[name] = {
      name, owner: o ? o.id : 'AI', ownerName: o ? o.name : 'AI', color: o ? colors[o.id] : PALETTE[Object.keys(SECTS).indexOf(name) % PALETTE.length],
      counts, gold: 3000,
      orgs: { '상단': Math.min(30, Math.floor(c0 * 0.08)), '정찰대': 5, '암살대': 0, '호위대': Math.min(8, Math.floor(c0 * 0.02)), '제자단': Math.min(10, Math.floor(c0 * 0.03)), '장서각': Math.min(8, Math.floor(c0 * 0.02)) },
      arts: [0, 0, 0], weapon: 0, leaderDead: false, leaderDeadDay: 0, peak: sum(counts), defeated: false, lastAssDay: 0,
      prodigy: null, academy: null, masters: [], pills: {},
    };
  }
  // 세계 전체에서 0.001% 확률로 단 한 명의 초월급 기인이 탄생한다.
  let prodigySect = null;
  if (rnd() < 0.00001) {
    const names = Object.keys(sects);
    prodigySect = names[Math.floor(rnd() * names.length)];
    sects[prodigySect].prodigy = { name: '천외기인', realm: 3, away: false };
  }
  for (const id in NODES) nodes[id] = { owner: NODES[id].core ? NODES[id].sect : (SECTS[id] ? id : (NODES[id].type === 'subsect' ? NODES[id].sect : null)), siege: null, destroyed: false, fortLevel: 0, garrison: REALMS.map(() => 0) };
  const W = { sects, nodes, marches: [], log: [], colors, d: 1, nextId: 0, elapsed: 0 };
  if (prodigySect) logPush(W, `🌌 천지개벽! [${prodigySect}]에 0.001%의 기연, 초월급 인간 「천외기인」이 나타났다!`, 'war');
  return W;
}

function makeUnits(s, mode) {
  const av = avail(s), u = REALMS.map(() => 0);
  for (let i = 0; i < 9; i++) {
    let f = 0;
    if (mode === 'mass') f = i <= 2 ? 0.8 : 0;
    else if (mode === 'elite') f = i >= 3 ? 1 : 0;
    else f = 0.7;
    u[i] = Math.floor(av[i] * f);
  }
  return u;
}

function launch(W, name, to, mode) {
  const s = W.sects[name];
  if (!s || s.defeated || !NODES[to] || !visible(to, W.d) || W.nodes[to].owner === name || W.nodes[to].destroyed) return false;
  if (W.marches.filter(m => m.sect === name).length >= 2) return false;
  const from = ADJ[to].find(id => W.nodes[id].owner === name);
  if (!from) return false;
  const units = makeUnits(s, mode);
  const specialPower = mode !== 'mass' && s.prodigy && !s.prodigy.away ? POWER[s.prodigy.realm] * 80 : 0;
  if (power(units) + specialPower <= 0) return false;
  for (let i = 0; i < 9; i++) s.counts[i] -= units[i];
  if (specialPower) s.prodigy.away = true;
  fixOrgs(s);
  W.nextId = (W.nextId || 0) + 1;
  W.marches.push({ id: W.nextId, sect: name, from, to, units, specialPower, start: W.elapsed, arriveAt: W.elapsed + Math.round(DAY_SECONDS * 0.25) });
  logPush(W, `🚩 [${name}] ${to}(으)로 출진 (병력 ${sum(units).toLocaleString()}명)`, 'war');
  return true;
}

function lossFracs(L) { return REALMS.map((_, i) => Math.min(0.97, Math.max(0, L * Math.max(0.1, 1.3 - 0.15 * i)))); }

function reincarnate(W, pid, pname, byName) {
  const cands = Object.keys(W.sects).filter(n => !W.sects[n].defeated && W.sects[n].owner === 'AI' && n !== byName);
  if (!cands.length) { logPush(W, `💀 ${pname}은(는) 후계자로 돌아올 문파가 없어 관전자가 되었다`, 'war'); return; }
  const n = cands[Math.floor(rnd() * cands.length)], t = W.sects[n];
  t.owner = pid; t.ownerName = pname; t.color = W.colors[pid] || '#cccccc';
  logPush(W, `🌀 ${pname}이(가) [${n}]의 후계자로 회귀했다!`, 'war');
}

function checkAbsorb(W, defName, attName) {
  const s = W.sects[defName], att = W.sects[attName];
  if (!s || !att || s.defeated || !s.leaderDead) return false;
  const total = sum(s.counts);
  if (total > 0.2 * s.peak) return false;
  for (let i = 0; i < 9; i++) att.counts[i] += Math.floor(s.counts[i] * 0.5);
  att.gold += Math.floor(s.gold * 0.5);
  att.peak = Math.max(att.peak, sum(att.counts));
  for (const id in W.nodes) if (W.nodes[id].owner === defName) W.nodes[id].owner = attName;
  W.marches = W.marches.filter(m => m.sect !== defName);
  const oldOwner = s.owner, oldName = s.ownerName;
  s.counts = REALMS.map(() => 0); s.gold = 0; s.defeated = true;
  logPush(W, `☠️ [${defName}] 멸문! [${attName}]이(가) 흡수했다`, 'war');
  if (oldOwner !== 'AI') reincarnate(W, oldOwner, oldName, attName);
  return true;
}

function destroyCoreSite(W, defName, attName, siteId) {
  const site = W.nodes[siteId], def = W.sects[defName], att = W.sects[attName];
  if (!site || !site.core || site.destroyed) return;
  site.destroyed = true; site.owner = null; site.siege = null; site.garrison = REALMS.map(() => 0); site.fortLevel = 0;
  logPush(W, `💥 [${attName}]이(가) [${defName}]의 핵심 거점 「${NODES[siteId].siteName || siteId}」을 파괴했다!`, 'war');
  const remaining = CORE_SITE_IDS[defName].filter(id => !W.nodes[id].destroyed).length;
  if (remaining === 0 && !def.defeated) {
    def.defeated = true;
    for (let i = 0; i < 9; i++) { att.counts[i] += Math.floor(def.counts[i] * 0.35); def.counts[i] = 0; }
    att.gold += Math.floor(def.gold * 0.5);
    for (const id in W.nodes) if (W.nodes[id].owner === defName && !W.nodes[id].core) W.nodes[id].owner = attName;
    W.marches = W.marches.filter(m => m.sect !== defName);
    def.gold = 0;
    logPush(W, `☠️ [${defName}]의 3대 핵심 거점이 모두 무너졌다! 문파가 멸문했다.`, 'war');
    if (def.owner !== 'AI') reincarnate(W, def.owner, def.ownerName, attName);
  }
}

function resolveMarch(W, m) {
  const att = W.sects[m.sect], day = W.d;
  if (!att || att.defeated) return;
  const home = () => { for (let i = 0; i < 9; i++) att.counts[i] += m.units[i]; if (m.specialPower && att.prodigy) att.prodigy.away = false; };
  const to = m.to, node = W.nodes[to];
  if (node.owner === m.sect) { home(); logPush(W, `[${m.sect}] 병력이 ${to}에 도착했지만 이미 아군 땅이라 복귀했다`, 'war'); return; }
  const hq = !!SECTS[to] && !W.sects[to].defeated;
  const core = !!NODES[to].core;
  const owner = node.owner, dsect = owner ? W.sects[owner] : null;
  const A = (power(m.units) + (m.specialPower || 0)) * atkMult(att) * (att.leaderDead ? 0.85 : 1);
  const D = Math.max(1, defPowerOf(W, to, day));
  const a = A / (A + D), win = A > D;
  const noise = () => 0.9 + rnd() * 0.2;
  let lA = 0.7 * (1 - a) * (win ? 1 : 1.3) * noise();
  let lD = 0.7 * a * (win ? 1.3 : 1) * noise();
  lA = Math.min(0.95, Math.max(0.02, lA)); lD = Math.min(0.95, Math.max(0.02, lD));
  const fa = lossFracs(lA);
  let killedA = 0, eliteA = 0;
  for (let i = 0; i < 9; i++) {
    const lost = Math.min(m.units[i], Math.round(m.units[i] * fa[i]));
    killedA += lost; if (i >= 3) eliteA += lost;
    att.counts[i] += m.units[i] - lost;
  }
  let killedD = 0, eliteD = 0;
  if (dsect) {
    const av = avail(dsect), fd = lossFracs(lD * (hq ? 1 : 0.3));
    for (let i = 0; i < 9; i++) {
      const lost = Math.min(dsect.counts[i], Math.round(av[i] * fd[i]));
      dsect.counts[i] -= lost; killedD += lost; if (i >= 3) eliteD += lost;
    }
    fixOrgs(dsect);
  }
  if (node.garrison && node.garrison.some(v => v > 0)) {
    const gf = lossFracs(lD * (core || hq ? 1 : 0.35));
    for (let i = 0; i < 9; i++) node.garrison[i] = Math.max(0, node.garrison[i] - Math.round(node.garrison[i] * gf[i]));
  }
  fixOrgs(att);
  const stat = `(아군 전사 ${killedA.toLocaleString()}${eliteA ? `, 그중 절정 이상 ${eliteA}` : ''}${dsect ? ` / 적 전사 ${killedD.toLocaleString()}${eliteD ? `, 그중 절정 이상 ${eliteD}` : ''}` : ''})`;
  if (win) {
    if (core) {
      const siege = node.siege && node.siege.sect === att.name ? node.siege : { sect: att.name, progress: 0 };
      siege.progress = Math.min(2, siege.progress + 1); node.siege = siege;
      if (siege.progress >= 2) destroyCoreSite(W, NODES[to].sect, att.name, to);
      else logPush(W, `⚔️ [${att.name}] ${to} 공략 성공! 핵심 거점 파괴 진척 ${siege.progress}/2 ${stat}`, 'war');
    } else if (!hq) {
      const siege = node.siege && node.siege.sect === att.name ? node.siege : { sect: att.name, progress: 0 };
      siege.progress = Math.min(2, siege.progress + 1);
      node.siege = siege;
      if (siege.progress >= 2) {
        node.owner = att.name; node.garrison = REALMS.map(() => 0); node.siege = null;
        logPush(W, `🏴 [${att.name}] ${to} 최종 점령! 두 차례의 승리 끝에 영토를 확보했다 ${stat}`, 'war');
      } else {
        logPush(W, `⚔️ [${att.name}] ${to} 전투 승리! 포위 진척 ${siege.progress}/2 — 아직 점령하지 못했다 ${stat}`, 'war');
      }
    } else {
      const siege = node.siege && node.siege.sect === att.name ? node.siege : { sect: att.name, progress: 0 };
      siege.progress = Math.min(2, siege.progress + 1); node.siege = siege;
      if (siege.progress >= 2) {
        logPush(W, `⚔️ [${att.name}]이(가) [${to}] 본산 공략에 두 차례 승리했다 ${stat}`, 'war');
        let chance = a > 0.67 ? 0.6 : 0.3;
        chance /= 1 + (dsect.orgs['호위대'] || 0) / 20;
        if (!dsect.leaderDead && rnd() < chance) {

        }

      } else {
        logPush(W, `⚔️ [${att.name}] 본산 공략 1/2 성공 — 문파의 최후 방어선이 버티고 있다 ${stat}`, 'war');
      }
    }
  } else {
    if (node.siege && node.siege.sect === att.name) {
      node.siege.progress = Math.max(0, node.siege.progress - 1);
      if (node.siege.progress === 0) node.siege = null;

    logPush(W, `🛡️ [${att.name}] ${to} 공격 실패, 패퇴 ${stat}`, 'war');
  }

}

function assassinate(W, name, targetName) {
  const s = W.sects[name], t = W.sects[targetName];
  if (!s || !t || t.defeated || targetName === name || t.leaderDead) return;
  if ((s.orgs['암살대'] || 0) < 5 || W.d <= s.lastAssDay) return;
  const p = assassinChance(s, t);
  s.lastAssDay = W.d;
  if (rnd() < p) {
    t.leaderDead = true; t.leaderDeadDay = W.d;
    for (let i = 0; i < 9; i++) t.counts[i] -= Math.floor(t.counts[i] * 0.03);
    fixOrgs(t);
    logPush(W, `🗡️ [${name}] 암살대가 [${targetName}] 장문인 암살에 성공했다!`, 'war');
    checkAbsorb(W, targetName, name);
  } else {
    const lost = Math.ceil((s.orgs['암살대'] || 0) * 0.6);
    s.orgs['암살대'] -= lost; s.counts[0] = Math.max(0, s.counts[0] - lost);
    logPush(W, `🗡️ [${name}] 암살대가 [${targetName}] 암살에 실패하고 ${lost}명을 잃었다`, 'war');
  }
}

function pickTarget(W, name) {
  const mine = ownedNodes(W, name); let best = null;
  for (const id in NODES) {
    if (!visible(id, W.d) || W.nodes[id].owner === name || W.nodes[id].destroyed) continue;
    if (!ADJ[id].some(a => mine.includes(a))) continue;
    const p = defPowerOf(W, id, W.d);
    if (!best || p < best.power) best = { id, power: p };
  }
  return best;
}

function applyCmd(W, pid, c) {
  const name = Object.keys(W.sects).find(n => W.sects[n].owner === pid && !W.sects[n].defeated);
  if (!name) return;
  const s = W.sects[name];
  switch (c.t) {
    case 'recruit': {
      const n = [10, 50, 100].includes(c.n) ? c.n : 0;
      if (!n || s.gold < n * RECRUIT_COST) break;
      s.gold -= n * RECRUIT_COST; s.counts[0] += n; break;
    }
    case 'train': {
      const i = Number(c.i), want = Number(c.n);
      if (!(i >= 0 && i <= 7) || ![1, 5, 20].includes(want)) break;
      const real = Math.min(want, s.counts[i], Math.floor(s.gold / TRAIN_COST[i]));
      if (real <= 0) break;
      let ok = real; if (i >= 2) { ok = 0; for (let k = 0; k < real; k++) if (rnd() < 1 / 3) ok++; }
      s.gold -= real * TRAIN_COST[i]; s.counts[i] -= ok; s.counts[i + 1] += ok;
      if (i >= 2) logPush(W, `📘 [${name}] ${REALMS[i]} ${real}명 직접 지도 — ${ok ? ok + '명 성공' : '모두 실패'}`, 'sys');
      else if (i + 1 >= 4 && ok) logPush(W, `📈 [${name}]에서 ${ok}명이 ${REALMS[i + 1]}에 올랐다`, 'sys');
      break;
    }
    case 'academy': {
      if (s.academy || s.gold < 1200) break;
      // 수련원은 삼류·이류 제자 10명을 받아 3일 뒤 일류로 배출한다.
      if (s.counts[0] + s.counts[1] < 10) break;
      let need = 10;
      for (const i of [0, 1]) { const n = Math.min(need, s.counts[i]); s.counts[i] -= n; need -= n; }
      s.gold -= 1200; s.academy = { count: 10, days: 3 };
      logPush(W, `🏯 [${name}] 10대제자 수련원에 제자 10명을 입관시켰다. 사흘 뒤 일류로 졸업한다.`, 'sys');
      break;
    }
    case 'org': {
      if (!ORG_NAMES.includes(c.o) || ![-10, -1, 1, 10].includes(c.d)) break;
      const max = Math.floor(s.counts[0] * 0.8), cur = s.orgs[c.o] || 0, others = orgTotal(s) - cur;
      s.orgs[c.o] = Math.max(0, Math.min(cur + c.d, max - others)); break;
    }
    case 'art': {
      const i = Number(c.i);
      if (!(i >= 0 && i <= 2) || s.arts[i] >= MAX_ART) break;
      const cost = artCost(s, i);
      if (s.gold < cost) break;
      s.gold -= cost; s.arts[i]++;
      logPush(W, `📜 [${name}] ${SECTS[name].arts[i].n} ${s.arts[i]}성 달성`, 'sys'); break;
    }
    case 'weapon': {
      const nw = WEAPONS[s.weapon + 1];
      if (!nw || s.gold < nw.cost) break;
      s.gold -= nw.cost; s.weapon++;
      logPush(W, `🗡️ [${name}] 무기고가 ${nw.g} 등급 「${nw.n}」(으)로 강화되었다`, 'sys'); break;
    }
    case 'march': {
      if (!['mass', 'elite', 'all'].includes(c.mode)) break;
      launch(W, name, c.to, c.mode); break;
    }
    case 'fort': {
      const n = W.nodes[c.to], level = n && (n.fortLevel || 0), cost = 900 * (level + 1) * (level + 1);
      if (!n || n.owner !== name || n.destroyed || level >= 3 || s.gold < cost) break;
      s.gold -= cost; n.fortLevel = level + 1;
      logPush(W, `🧱 [${name}] ${c.to}에 방어 거점 ${n.fortLevel}단계를 건설했다`, 'sys'); break;
    }
    case 'garrison': {
      const n = W.nodes[c.to], i = Number(c.i), amount = Number(c.n);
      if (!n || n.owner !== name || n.destroyed || !(i >= 0 && i <= 8) || ![1,10,100].includes(amount) || s.counts[i] < amount) break;
      s.counts[i] -= amount; n.garrison = n.garrison || REALMS.map(() => 0); n.garrison[i] = (n.garrison[i] || 0) + amount;
      logPush(W, `🛡️ [${name}] ${c.to}에 ${REALMS[i]} ${amount}명을 배치했다`, 'sys'); break;
    }
    case 'withdraw': {
      const n = W.nodes[c.to], i = Number(c.i), amount = Number(c.n);
      if (!n || n.owner !== name || !(i >= 0 && i <= 8) || ![1,10,100].includes(amount) || (n.garrison?.[i] || 0) < amount) break;
      n.garrison[i] -= amount; s.counts[i] += amount; break;
    }
    case 'buyPill': {
      const i = Number(c.i); if (!(i >= 2 && i <= 7) || s.gold < PILL_COST[i]) break;
      s.gold -= PILL_COST[i]; s.pills = s.pills || {}; s.pills[i] = (s.pills[i] || 0) + 1; break;
    }
    case 'givePill': {
      const i = Number(c.i); s.pills = s.pills || {};
      if (!(i >= 2 && i <= 7) || !(s.pills[i] > 0) || s.counts[i] < 1) break;
      s.pills[i]--; s.counts[i]--; s.counts[i + 1]++;
      const m = (s.masters || []).find(x => x.id === c.mid && x.realm === i);
      if (m) { m.realm = i + 1; m.pills = (m.pills || 0) + 1; logPush(W, `💊 [${name}] 「${m.alias}」 ${m.name}이(가) ${PILL_NAME[i]}을(를) 복용해 ${REALMS[i + 1]}에 올랐다!`, 'war'); }
      else logPush(W, `💊 [${name}] ${PILL_NAME[i]} 복용 — 가장 강한 ${REALMS[i]} 무인이 ${REALMS[i + 1]}에 올랐다`, 'war');
      break;
    }
    case 'kill': assassinate(W, name, c.target); break;
  }
}

function aiAct(W, name) {
  const s = W.sects[name];
  if (s.defeated || s.owner !== 'AI') return;
  // AI는 매일 전쟁보다 내정·방비를 우선한다.
  let budget = Math.floor(s.gold * 0.45);
  for (const i of [3, 2, 4, 1, 0]) {
    const cost = TRAIN_COST[i], n = Math.min(6, s.counts[i], Math.floor(budget / cost));
    if (n > 0) { const ok = i >= 2 ? Array.from({ length: n }).filter(() => rnd() < 1 / 3).length : n; s.counts[i] -= ok; s.counts[i + 1] += ok; s.gold -= n * cost; budget -= n * cost; }
  }
  const rec = Math.min(10, Math.floor(budget * 0.35 / RECRUIT_COST));
  if (rec > 0) { s.counts[0] += rec; s.gold -= rec * RECRUIT_COST; }
  const nw = WEAPONS[s.weapon + 1];
  if (nw && s.gold >= nw.cost * 1.8 && rnd() < 0.35) { s.gold -= nw.cost; s.weapon++; }
  if (rnd() < 0.35) {
    const ai = Math.floor(rnd() * 3);

    const level = W.nodes[target].fortLevel || 0, cost = 900 * (level + 1) * (level + 1);

    const s = W.sects[name];

        s.academy = null;

    if (s.prodigy && s.prodigy.realm < 8 && rnd() < 0.5) {

    }

    for (let i = 7; i >= 0; i--) {

      const exact = s.counts[i] * PROMOTE[i] * mult * highRealmGate;
      let n = Math.floor(exact);
      if (rnd() < exact - n) n++;

      s.counts[i] -= n; s.counts[i + 1] += n;
      if (n > 0 && i + 1 >= 5) logPush(W, `🌟 [${name}]에서 ${n}명이 ${REALMS[i + 1]}에 올랐다`, 'sys');

function rankOf(s) { const p = power(s.counts); let i = 0; RANKS.forEach((r, k) => { if (p >= r[0]) i = k; }); return { i, label: RANKS[i][1], next: RANKS[i + 1], p }; }
const SUR = ['남궁','제갈','모용','독고','황보','하후','단목','사마','연','백','유','한','진','소','청','천','위','곽'];
const GIV = ['천','운','현','진','태','검','무','광','혁','도','린','준','성','하','량','태소','청휘','무진','백야','한서'];
const ALA = ['천하무적','신검','벽력','혈수','광풍','청영','철권','금강','태허','현천','적염','백운','야차','천외','신룡','무상','일월','구천','비검','파천'];
const ALB = ['검왕','도황','권제','장군','검성','마존','신수','일검','창신','선인','패왕','검선','천존','귀검','제일검'];

}
function newMaster(W, s, r) {
  const used = new Set(); for (const n in W.sects) (W.sects[n].masters || []).forEach(m => used.add(m.alias));
  let al; for (let k = 0; k < 30; k++) { al = pickA(ALA) + pickA(ALB); if (!used.has(al)) break; }
  return { id: 'm' + Math.floor(rnd() * 1e9).toString(36), name: pickA(SUR) + pickA(GIV), alias: al, realm: r, roll: +(0.85 + rnd() * 0.3).toFixed(2), pills: 0 };

// 현경 이상 인원수(counts)와 이름 있는 고수 명단을 맞춘다. 출정·주둔 중인 인원도 포함해서 센다.
function syncMasters(W, s) {

  const M = s.masters = s.masters || [], tot = REALMS.map((_, i) => s.counts[i]);
  for (const m of W.marches) if (m.sect === s.name) m.units.forEach((u, i) => tot[i] += u);
  for (const id in W.nodes) { const n = W.nodes[id]; if (n.owner === s.name && n.garrison) n.garrison.forEach((u, i) => tot[i] += u || 0); }
  const st = m => masterStats(m, s).atk;

    while (L.length < tot[r]) {
      const low = r > 6 ? M.filter(m => m.realm === r - 1) : [];
      if (low.length > tot[r - 1]) { const m = low.sort((a, b) => st(b) - st(a))[0]; m.realm = r; L.push(m); logPush(W, `🌟 [${s.name}] 「${m.alias}」 ${m.name}이(가) ${REALMS[r]}에 올랐다!`, 'war'); }

    }
    while (L.length > tot[r]) { L.sort((a, b) => st(a) - st(b)); const m = L.shift(); M.splice(M.indexOf(m), 1); logPush(W, `⚰️ [${s.name}] 「${m.alias}」 ${m.name}이(가) 전사했다`, 'war'); }

/* ---------- 방장: 시간 + 명령 처리 + 일일 갱신 ---------- */
function loadWorld() {
  const sects = get('sects'), nodes = get('nodes');
  if (!sects || !nodes) return null;
  return { sects: clone(sects), nodes: clone(nodes), marches: clone(get('marches') || []), log: clone(get('log') || []),
           colors: get('colors') || {}, nextId: get('nextId') || 0, elapsed: 0, d: 1 };
}

function hostTick() {
  if (!Playroom.isHost() || get('phase') !== 'play') { lastTick = null; return; }
  const now = Date.now();
  if (lastTick === null) { lastTick = now; return; }
  const dt = Math.min(300, (now - lastTick) / 1000); lastTick = now;
  const elapsed = (get('elapsed') || 0) + dt * (get('speed') || 1);
  Playroom.setState('elapsed', elapsed, true);

  const W = loadWorld(); if (!W) return;
  ONLINE = new Set(players.map(p => p.id));
  W.elapsed = elapsed; W.d = Math.floor(elapsed / DAY_SECONDS) + 1;
  const before = JSON.stringify([W.sects, W.nodes, W.marches, W.log, W.nextId]);

  // 1) 플레이어 명령
  const proc = clone(get('proc') || {}); let procChanged = false;
  for (const p of players) {
    const q = p.getState('cmds') || [], last = proc[p.id] || 0;
    for (const c of q) {
      if (c.n > (proc[p.id] || 0)) { applyCmd(W, p.id, c); proc[p.id] = c.n; procChanged = true; }
    }
  }
  if (procChanged) Playroom.setState('proc', proc, true);

  // 2) 도착한 병력 전투
  const due = W.marches.filter(m => m.arriveAt <= elapsed);
  W.marches = W.marches.filter(m => m.arriveAt > elapsed);
  for (const m of due) resolveMarch(W, m);

  // 3) 하루가 지났으면 일일 갱신
  const realDay = W.d;
  let done = get('processedDay') || 1; const startDone = done;
  while (done < realDay) { done++; dailyUpdate(W, done); }
  W.d = realDay;
  if (done !== startDone) Playroom.setState('processedDay', done, true);

  for (const n in W.sects) syncMasters(W, W.sects[n]);
  checkEnd(W);

  if (JSON.stringify([W.sects, W.nodes, W.marches, W.log, W.nextId]) !== before) {
    Playroom.setState('sects', W.sects, true);
    Playroom.setState('nodes', W.nodes, true);
    Playroom.setState('marches', W.marches, true);
    Playroom.setState('log', W.log, true);
    Playroom.setState('nextId', W.nextId, true);
  }
  if (W.winner) { Playroom.setState('winner', W.winner, true); Playroom.setState('phase', 'end', true); }
}

function pickSect(name) {
  const takenBy = players.find(p => p.getState('sect') === name);
  if (takenBy && takenBy.id !== Playroom.myPlayer().id) return;
  Playroom.myPlayer().setState('sect', name, true);
}

function startGame() {
  if (!Playroom.isHost()) return;
  const picks = {};
  for (const name in SECTS) {
    const o = players.find(p => p.getState('sect') === name);
    if (o) picks[name] = { id: o.id, name: o.getProfile().name };
  }
  const W = makeWorld(picks);
  logPush(W, '🔥 천하쟁패가 시작되었다! 각 문파의 본산과 핵심 거점 2곳, 총 3곳을 모두 파괴해야 멸문한다.', 'sys');
  const proc = {};
  for (const p of players) { const q = p.getState('cmds') || []; proc[p.id] = q.length ? q[q.length - 1].n : 0; }
  Playroom.setState('proc', proc, true);
  Playroom.setState('sects', W.sects, true);
  Playroom.setState('nodes', W.nodes, true);
  Playroom.setState('marches', [], true);
  Playroom.setState('log', W.log, true);
  Playroom.setState('colors', W.colors, true);
  Playroom.setState('nextId', 0, true);
  Playroom.setState('processedDay', 1, true);
  Playroom.setState('elapsed', 0, true);
  Playroom.setState('winner', null, true);
  Playroom.setState('phase', 'play', true);

function send(c) {

  if (me && attackable.has(id)) {
    const full = W.marches.filter(m => m.sect === me.name).length >= 2;
    const modes = [['mass', '대군 출진', '삼류~일류 80%'], ['elite', '정예 출진', '절정 이상 전원'], ['all', '전군 출진', '전체 70%']];
    h += '<div style="margin-top:8px"><b>출진</b></div>';
    for (const [m, label, desc] of modes) {
      const P = (power(makeUnits(me, m)) + (m !== 'mass' ? prodigyPower(me) : 0)) * atkMult(me);
      h += `<div>${btn(`data-act="march" data-to="${id}" data-mode="${m}"`, label, full || P <= 0)} <span class="dim">${desc} · 공격 전력 ${num(P)}</span></div>`;
    }
    if (full) h += '<div class="red">부대를 이미 2개 출정시켰어요</div>';
  } else if (me && ns.owner !== me.name) {
    h += '<div class="dim" style="margin-top:8px">내 영토와 맞닿아 있지 않아서 아직 공격할 수 없어요</div>';
  }
  return h;
}

/* ----- 문파·육성 ----- */
function tabSect(W, me) {
  const c = me.counts, total = sum(c), org = orgTotal(me);
  const away = sum(W.marches.filter(m => m.sect === me.name).map(m => sum(m.units)));
  const rows = REALMS.map((r, i) => {
    const train = i <= 7 ? [1, 5, 20].map(n => btn(`data-act="train" data-i="${i}" data-n="${n}"`, `${n}명`, me.gold < TRAIN_COST[i])).join('') + ` <span class="dim">1명당 ${num(TRAIN_COST[i])}금</span>` : '<span class="dim">최상위</span>';
    return `<tr><td>${r}</td><td>${num(c[i])}</td><td style="text-align:left">${i <= 7 ? '지도 → ' + REALMS[i + 1] : ''} ${train}</td></tr>`;
  }).reverse().join('');
  return `<div class="panel"><h3>🏯 ${me.name} 무인 현황 <span class="tag me">${rankOf(me).label}</span></h3>${rankOf(me).next ? `<div class="dim">다음 등급 「${rankOf(me).next[1]}」까지 전투력 ${num(rankOf(me).p)} / ${num(rankOf(me).next[0])}</div><div class="bar" style="margin:4px 0 8px"><div style="width:${Math.min(100, rankOf(me).p / rankOf(me).next[0] * 100)}%"></div></div>` : ''}
    <div class="dim">대규모로 키울지, 소수정예로 키울지는 문주의 선택이에요. 삼류를 늘리면 싸고 빠르지만 약하고, 높은 경지는 비싸고 느리지만 전투에서 훨씬 오래 살아남아요.</div>
    <div style="margin:8px 0">모집: ${[10, 50, 100].map(n => btn(`data-act="recruit" data-n="${n}"`, `삼류 ${n}명 (${num(n * RECRUIT_COST)}금)`, me.gold < n * RECRUIT_COST)).join('')}</div>
    <div style="margin:10px 0;padding:10px;border:1px solid #9b793f;border-radius:8px;background:linear-gradient(120deg,#302719,#1d1a16)"><b class="gold">🎓 10대제자 수련원</b><div class="dim">삼류·이류 제자 10명을 입관시켜 3일간 수련합니다. 졸업 시 전원 일류가 됩니다. (입관 비용 1,200금)</div>${me.academy ? `<div class="gold">수련 진행 중 · 남은 기간 ${me.academy.days}일 · 졸업 예정 ${me.academy.count}명</div>` : btn('data-act="academy"', '제자 10명 수련원 입관 (1,200금)', me.gold < 1200 || c[0] + c[1] < 10)}${!me.academy && c[0] + c[1] < 10 ? '<div class="red">삼류·이류 제자가 최소 10명 필요합니다.</div>' : ''}</div>
    <table><tr><th>경지</th><th>인원</th><th style="text-align:left">직접 지도(일류 이상은 성공 확률 1/3 · 실패해도 금 소모)</th></tr>${rows}
    <tr><th>합계</th><th>${num(total)}</th><th style="text-align:left" class="dim">조직 배치 ${num(org)}명 · 출정 중 ${num(away)}명 포함 아님</th></tr></table>
    <div class="dim" style="margin-top:8px">⚙️ 하루마다 자연 승급이 판정돼요. 문파별 무인 자질 보정에 제자단·약초밭 효과가 추가 적용됩니다.</div>
    <div class="dim" style="margin-top:5px">문파 자질: ${SECTS[me.name].talentLabel || '일반 자질 보정 ×1.0'} · 문주 부재 시 승급 확률 50%</div>
    <div class="dim" style="margin-top:5px;line-height:1.9">삼류 → 이류 4% · 이류 → 일류 3% · 일류 → 절정 2% · 절정 → 초절정 0.8%<br>초절정 → 화경 0.3% · 화경 → 현경 0.07% · 현경 → 생사경 0.05% · 생사경 → 자연경 0.01%<br><b class="gold">초절정 이상은 재능의 벽:</b> 자연 승급 확률이 기존의 8%만 적용되며, 문파별 천재 자질이 추가 반영됩니다.</div>
    ${me.prodigy ? `<div style="margin-top:10px;padding:10px;border:1px solid #b98b42;border-radius:8px;background:linear-gradient(120deg,#352a1a,#211b16)"><b class="gold">🌠 초월급 기인 — ${me.prodigy.name}</b><div>현재 경지: <b>${REALMS[me.prodigy.realm]}</b> · 매일 50% 확률로 한 단계 돌파 · 일반 무인보다 압도적인 전투력</div></div>` : ''}
    <div style="margin-top:8px">공격 배율 <b>×${atkMult(me).toFixed(2)}</b> · 방어 배율 <b>×${defMult(me).toFixed(2)}</b> · 전투력 합계 <b>${num(power(avail(me)))}</b></div></div>`;
}

/* ----- 조직 ----- */
function tabOrg(W, me) {
  const max = Math.floor(me.counts[0] * 0.8), used = orgTotal(me), scouts = (me.orgs['정찰대'] || 0) >= 10;
  const rows = ORGS.map(([n, d]) => `<tr><td>${n}<div class="dim">${d}</div></td><td>${num(me.orgs[n] || 0)}</td>
    <td style="text-align:left">${[-10, -1, 1, 10].map(x => btn(`data-act="org" data-o="${n}" data-d="${x}"`, (x > 0 ? '+' : '') + x)).join('')}</td></tr>`).join('');
  const ready = (me.orgs['암살대'] || 0) >= 5 && W.d > me.lastAssDay;
  const targets = Object.keys(W.sects).filter(n => n !== me.name && !W.sects[n].defeated && !W.sects[n].leaderDead).map(n => {
    const t = W.sects[n];
    return `<div>${btn(`data-act="kill" data-target="${n}"`, '암살 시도', !ready)} ${n} <span class="dim">(${t.owner === 'AI' ? 'AI' : esc(t.ownerName)}) 성공률 ${scouts ? Math.round(assassinChance(me, t) * 100) + '%' : '불명 (정찰대 필요)'}</span></div>`;
  }).join('');
  return `<div class="panel"><h3>👥 문파 조직</h3>
    <div class="dim">삼류 무인을 각 조직에 배치해요. 배치된 인원은 전투에 참가하지 않아요. (삼류의 80%까지 배치 가능) 배치 ${num(used)} / ${num(max)}</div>
    <table><tr><th>조직</th><th>인원</th><th style="text-align:left">조정</th></tr>${rows}</table></div>
    <div class="panel"><h3>🗡️ 암살 작전</h3>
    <div class="dim">암살대 5명 이상, 하루에 한 번. 성공하면 장문인이 전사해 그 문파가 크게 약해져요. 실패하면 암살대 60%를 잃어요. ${ready ? '' : '<span class="red">(지금은 불가능: 암살대 부족 또는 오늘 이미 시도)</span>'}</div>${targets || '<div class="dim">대상 없음</div>'}</div>`;
}

/* ----- 무공·무기 ----- */
function tabArts(W, me) {
  const arts = SECTS[me.name].arts.map((a, i) => {
    const lv = me.arts[i], cost = artCost(me, i), k = KIND[a.k];
    return `<tr><td><b>${a.n}</b><div class="dim">${a.k} · 한 성마다 공격 +${Math.round(k[0] * 100)}% / 방어 +${Math.round(k[1] * 100)}%</div></td>
      <td>${'★'.repeat(lv)}${'☆'.repeat(MAX_ART - lv)}</td>
      <td style="text-align:left">${lv >= MAX_ART ? '<span class="green">대성</span>' : btn(`data-act="art" data-i="${i}"`, `연구 (${num(cost)}금)`, me.gold < cost)}</td></tr>`;
  }).join('');
  const w = WEAPONS[me.weapon], nw = WEAPONS[me.weapon + 1];
  return `<div class="panel"><h3>📜 ${me.name} 고유 무공</h3>
    <div class="dim">다른 문파는 이 무공을 배울 수 없어요. 장서각 인원이 많으면 연구비가 줄어들어요.</div>
    <table><tr><th>무공</th><th>수련</th><th style="text-align:left">연구</th></tr>${arts}</table></div>
    <div class="panel"><h3>🗡️ 무기고</h3>
    <div>현재: <b class="gold">[${w.g}] ${w.n}</b> <span class="dim">공격 ×${w.atk} · 방어 +${Math.round(w.def * 100)}%</span></div>
    <div style="margin-top:6px">${nw ? btn('data-act="weapon"', `[${nw.g}] ${nw.n}(으)로 강화 (${num(nw.cost)}금)`, me.gold < nw.cost) + `<span class="dim"> 공격 ×${nw.atk} · 방어 +${Math.round(nw.def * 100)}%</span>` : '<span class="green">최고 등급입니다</span>'}</div></div>`;
}

/* ----- 천하 형세 ----- */
function tabWorld(W, me) { return tabWorld0(W, me) + hallOfMasters(W); }
function tabWorld0(W, me) {
  const scouts = me && (me.orgs['정찰대'] || 0) >= 10;
  const list = Object.keys(W.sects).map(n => W.sects[n]).filter(s => !s.defeated).map(s => {
    let top = 0; for (let i = 8; i >= 0; i--) if (s.counts[i] > 0) { top = i; break; }
    return { s, top, pw: power(s.counts) };
  }).sort((a, b) => b.top - a.top || b.pw - a.pw);
  const rows = list.map(({ s, top }) => {
    const mineRow = me && s.name === me.name, exact = mineRow || scouts;
    const strong = s.counts.map((c, i) => [REALMS[i], c]).slice(4).filter(x => x[1] > 0).map(x => `${x[0]} ${x[1]}`).join(' / ') || '-';
    const jeol = sum(s.counts.slice(3)), total = sum(s.counts);
    const cores = CORE_SITE_IDS[s.name].filter(id => !W.nodes[id].destroyed).length;
    const tag = s.owner === 'AI' ? '<span class="tag ai">AI</span>' : `<span class="tag ${mineRow ? 'me' : ''}">${esc(s.ownerName)}</span>`;
    return `<tr><td><span style="color:${s.color}">●</span> ${s.name}${tag}${s.prodigy ? ` <span class="gold">🌠 초월급 기인(${REALMS[s.prodigy.realm]})</span>` : ''}${s.leaderDead ? ' <span class="red">☠</span>' : ''}</td>
      <td>${REALMS[top]}</td><td style="text-align:left">${strong}</td>
      <td><b class="gold">${cores}/3</b></td><td>${exact ? num(jeol) : fuzz(jeol, s.name + 'j' + W.d)}</td><td>${exact ? num(total) : fuzz(total, s.name + 't' + W.d)}</td></tr>`;
  }).join('');
  const dead = Object.keys(W.sects).filter(n => W.sects[n].defeated).map(n => `${n}`).join(', ');
  return `<div class="panel"><h3>🌏 천하 형세 (강한 순)</h3>
    <div class="dim">각 문파는 본산 포함 핵심 거점 3곳을 보유합니다. 핵심 거점이 모두 파괴되면 해당 문파는 멸문합니다. 초절정 이상의 강자는 누구나 볼 수 있어요.</div>
    <table><tr><th>문파</th><th>최고 경지</th><th style="text-align:left">강자 (초절정 이상)</th><th>핵심 거점</th><th>절정 이상</th><th>전체</th></tr>${rows}</table>
    ${dead ? `<div class="dim" style="margin-top:8px">멸문: ${dead}</div>` : ''}</div>`;
}

function financePanel(W, me) {
  const mult = (SECTS[me.name].traits && SECTS[me.name].traits.stats.income) || 1;
  const nodes = Object.keys(W.nodes).filter(id => W.nodes[id].owner === me.name && NODES[id].income > 0).sort((a, b) => NODES[b].income - NODES[a].income);
  const land = sum(nodes.map(id => NODES[id].income)), shop = (me.orgs['상단'] || 0) * 3;
  return `<div class="panel"><h3>💰 재정 (하루 기준)</h3><table>
    <tr><td>기본 수입</td><td>+150</td></tr><tr><td>상단 (${me.orgs['상단'] || 0}명 × 3)</td><td>+${num(shop)}</td></tr>
    <tr><td>영토 수입 (${nodes.length}곳)</td><td>+${num(land)}</td></tr><tr><td>문파 수입 보정</td><td>×${mult}</td></tr>
    <tr><td><b>총수입</b></td><td><b>${num(grossOf(W, me))}</b></td></tr><tr><td>인원 유지비</td><td class="red">−${num(upkeepOf(me))}</td></tr>
    <tr><td><b>하루 순수입</b></td><td><b class="gold">+${num(incomeOf(W, me))}</b></td></tr></table>
    <div class="dim" style="margin-top:6px">영토: ${nodes.map(id => `${esc(id)} +${NODES[id].income}`).join(' · ') || '없음'}</div></div>`;
}
const mrow = (m, s, extra) => { const t = masterStats(m, s); return `<tr><td><b class="gold">「${esc(m.alias)}」</b> ${esc(m.name)}<span class="tag">${REALMS[m.realm]}</span>${m.pills ? `<span class="tag">영단 ${m.pills}회</span>` : ''}</td>${extra || ''}<td>${num(t.hp)}</td><td>${t.qi}갑자</td><td>${num(t.atk)}</td></tr>`; };
function tabPill(W, me) {
  const P = me.pills || {};
  const rows = [2, 3, 4, 5, 6, 7].map(i => `<tr><td><b>${PILL_NAME[i]}</b><div class="dim">${REALMS[i]} → ${REALMS[i + 1]}</div></td><td>${num(PILL_COST[i])}금</td><td>${P[i] || 0}</td><td style="text-align:left">${btn(`data-act="buyPill" data-i="${i}"`, '구매', me.gold < PILL_COST[i])}${btn(`data-act="givePill" data-i="${i}"`, '가장 강한 자에게', !(P[i] > 0) || me.counts[i] < 1)}</td></tr>`).join('');
  const ms = (me.masters || []).slice().sort((a, b) => b.realm - a.realm || masterStats(b, me).atk - masterStats(a, me).atk);
  const mr = ms.map(m => mrow(m, me, '')).join('') || '<tr><td colspan="4" class="dim">아직 현경에 오른 고수가 없습니다</td></tr>';
  const pick = ms.filter(m => m.realm < 8).map(m => `<div>${btn(`data-act="givePill" data-i="${m.realm}" data-m="${m.id}"`, `「${esc(m.alias)}」에게 ${PILL_NAME[m.realm]} 복용`, !(P[m.realm] > 0) || me.counts[m.realm] < 1)}</div>`).join('');
  return `<div class="panel"><h3>💊 영단 창고</h3><div class="dim">돈이 쌓이면 영단을 사서 문파의 가장 강한 무인에게 먹여 한 단계 끌어올릴 수 있어요. 현경 이상 고수는 아래에서 직접 골라 복용시킬 수 있고, 복용할 때마다 체력·내공·공격력이 12%씩 오릅니다.</div>
    <table><tr><th>영단</th><th>가격</th><th>보유</th><th style="text-align:left">행동</th></tr>${rows}</table></div>
    <div class="panel"><h3>👑 ${me.name} 고수 명부 (현경 이상)</h3><table><tr><th>별호 · 이름</th><th>체력</th><th>내공</th><th>공격력</th></tr>${mr}</table>${pick ? `<div style="margin-top:8px"><b>고수에게 직접 영단 복용</b>${pick}</div>` : ''}</div>`;
}
function hallOfMasters(W) {
  const all = []; for (const n in W.sects) { const s = W.sects[n]; if (!s.defeated) (s.masters || []).forEach(m => all.push([s, m, masterStats(m, s)])); }
  all.sort((a, b) => b[1].realm - a[1].realm || b[2].atk - a[2].atk);
  const rows = all.map(([s, m]) => mrow(m, s, `<td style="color:${s.color}">${s.name}</td>`)).join('') || '<tr><td colspan="5" class="dim">아직 현경에 오른 고수가 없습니다</td></tr>';
  return `<div class="panel"><h3>👑 천하 고수 명부 (현경 이상 · 별호)</h3><table><tr><th>별호 · 이름</th><th style="text-align:left">문파</th><th>체력</th><th>내공</th><th>공격력</th></tr>${rows}</table></div>`;
}
boot();
</script>
</body>
</html>
